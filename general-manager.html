<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#0f172a">

    <title>总经理审批中心</title>


    <!-- =====================================================
         总经理权限保护

         必须同时满足：
         1. 已完成密码验证
         2. 验证岗位 = 总经理
         3. 有人员ID
         4. 会话没有过期

         管理员验证不能进入总经理端。
    ====================================================== -->

    <script>

        (function () {

            "use strict";


            let session = null;


            try {

                session =
                    JSON.parse(
                        sessionStorage.getItem(
                            "managementSession"
                        )
                    );

            } catch (error) {

                session = null;

            }


            const now =
                Date.now();


            const valid =

                session &&

                session.verified === true &&

                session.position ===
                    "总经理" &&

                session.personId &&

                Number(
                    session.expiresAt
                ) > now;


            /*
               没有有效总经理会话
               → 返回总经理密码验证
            */

            if (!valid) {

                sessionStorage.removeItem(
                    "managementSession"
                );


                localStorage.setItem(
                    "pendingProtectedPosition",
                    "总经理"
                );


                location.replace(
                    "management-login.html?position=" +
                    encodeURIComponent(
                        "总经理"
                    )
                );

            }

        })();

    </script>


    <link
        rel="stylesheet"
        href="css/style.css?v=2.9.6"
    >


    <link
        rel="stylesheet"
        href="css/general-manager.css?v=2.9.3"
    >


    <style>

        .gm-login-status {
            max-width: 1100px;
            margin: 15px auto 0;
            padding: 0 15px;
        }


        .gm-login-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            padding: 12px 14px;

            background: #ecfdf5;
            border: 1px solid #bbf7d0;
            border-radius: 10px;

            color: #166534;
            font-size: 13px;
        }


        .gm-login-box button {
            width: auto;
            margin: 0;
            padding: 8px 12px;

            background: #ffffff;
            color: #334155;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            cursor: pointer;
            font-weight: 700;
        }


        .gm-security-note {
            margin-top: 15px;
            padding: 12px 14px;

            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;

            color: #1e40af;
            font-size: 13px;
            line-height: 1.6;
        }


        .gm-bottom-actions {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 15px;
        }


        .gm-bottom-actions button {
            width: 100%;
        }


        @media (max-width: 700px) {

            .gm-login-box {
                flex-direction: column;
                align-items: stretch;
            }


            .gm-login-box button {
                width: 100%;
            }


            .gm-bottom-actions {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header class="gm-header">

    <div>

        <h1>
            👔 总经理审批中心
        </h1>

        <p>
            General Manager Approval Center
        </p>

    </div>


    <span>
        V2.9.6
    </span>

</header>


<!-- =====================================================
     总经理登录状态
===================================================== -->

<div class="gm-login-status">

    <div class="gm-login-box">

        <div>

            🔐 已通过总经理身份验证

            </span>

        </div>


        <button

</div>


<main class="gm-main">


    <!-- =====================================================
         管理人员请假审批汇总
    ====================================================== -->

    <section class="gm-card">


        <div class="section-title">

                <h2>

            <div class="summary-card success">

        <div class="gm-security-note">

            当前页面只处理需要总经理审批的管理人员请假申请。

            普通司机请假仍由车队长 / 调度审批。

        </div>


    </section>


    <!-- =====================================================
         待审批
    ====================================================== -->

    <section class="gm-card">


        <div class="section-title">


            <div>

                <h2>
                    🟡 待审批
                </h2>


                <p>
                    仅显示需要总经理审批的申请
                </p>

    <!-- =====================================================

    <!-- =====================================================

    ====================================================== -->

    <div class="gm-bottom-actions">


        <button
            type="button"
            class="back-button"
            onclick="location.href='dispatch.html'"
        >
            返回调度中心
        </button>


        <button
            type="button"
            class="back-button"
            onclick="location.href='index.html'"

            返回系统首页
        </button>


    </div>


</main>


<footer>

    矿山管理系统 · 总经理审批端 V2.9.6

</footer>


<!-- =====================================================
     保留原 V2.9.3 请假审批业务逻辑
===================================================== -->

<script
    src="js/general-manager.js?v=2.9.3"
></script>


<script>

"use strict";


/* =====================================================
   获取总经理会话
===================================================== */

function getGeneralManagerSession() {

    try {

        return JSON.parse(
            sessionStorage.getItem(
                "managementSession"
            )
        );

    } catch (error) {

        return null;

    }

}


/* =====================================================
   再次验证总经理会话

   防止页面打开后会话过期。
===================================================== */

function validateGeneralManagerSession() {

    const session =
        getGeneralManagerSession();


    const valid =

        session &&

        session.verified === true &&

        session.position ===
            "总经理" &&

        session.personId &&

        Number(
            session.expiresAt
        ) > Date.now();


    if (!valid) {

        sessionStorage.removeItem(
            "managementSession"
        );


        localStorage.setItem(
            "pendingProtectedPosition",
            "总经理"
        );


        location.replace(
            "management-login.html?position=" +
            encodeURIComponent(
                "总经理"
            )
        );


        return false;

    }


    return true;

}


/* =====================================================
   显示剩余验证时间
===================================================== */

function updateSessionTime() {

    const session =
        getGeneralManagerSession();


    if (!session) {
        return;
    }


    const remaining =
        Number(
            session.expiresAt
        ) -
        Date.now();


    if (remaining <= 0) {

        validateGeneralManagerSession();

        return;

    }


    const minutes =
        Math.max(
            1,
            Math.ceil(
                remaining /
                60000
            )
        );


    const element =
        document.getElementById(
            "gmSessionTime"
        );


    if (element) {

        element.textContent =
            " · 本次验证约 " +
            minutes +
            " 分钟后失效";

    }

}


/* =====================================================
   退出总经理端
===================================================== */

function logoutGeneralManager() {

    const confirmed =
        confirm(
            "确定退出总经理端吗？"
        );


    if (!confirmed) {
        return;
    }


    sessionStorage.removeItem(
        "managementSession"
    );


    localStorage.removeItem(
        "pendingProtectedPersonId"
    );


    localStorage.removeItem(
        "pendingProtectedPosition"
    );


    location.href =
        "index.html";

}


/* =====================================================
   页面运行期间持续检查会话
===================================================== */

validateGeneralManagerSession();

updateSessionTime();


setInterval(
    function () {

        if (
            validateGeneralManagerSession()
        ) {

            updateSessionTime();

        }

    },
    30000
);

</script>


</body>

</html>
