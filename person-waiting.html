<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>
        等待审核 - 矿山管理系统
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f1f5f9;
            color: #0f172a;
            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;
        }

        header {
            padding: 24px 16px;
            background: #0f172a;
            color: #fff;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 23px;
        }

        header p {
            margin: 7px 0 0;
            color: #cbd5e1;
            font-size: 12px;
        }

        main {
            max-width: 680px;
            margin: 0 auto;
            padding: 20px 14px 40px;
        }

        .card {
            margin-bottom: 15px;
            padding: 18px;
            border-radius: 16px;
            background: #fff;
            box-shadow:
                0 5px 20px
                rgba(15, 23, 42, .06);
        }

        .status-area {
            padding: 25px 16px;
            text-align: center;
        }

        .status-icon {
            display: block;
            margin-bottom: 12px;
            font-size: 52px;
        }

        .status-title {
            margin: 0;
            font-size: 22px;
        }

        .status-text {
            margin: 10px 0 0;
            color: #64748b;
            font-size: 13px;
            line-height: 1.8;
        }

        .badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge.yellow {
            background: #fef3c7;
            color: #92400e;
        }

        .badge.green {
            background: #dcfce7;
            color: #166534;
        }

        .badge.red {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge.gray {
            background: #e2e8f0;
            color: #475569;
        }

        .info-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .info-box {
            padding: 12px;
            border-radius: 11px;
            background: #f8fafc;
        }

        .info-box span {
            display: block;
            margin-bottom: 5px;
            color: #64748b;
            font-size: 12px;
        }

        .info-box strong {
            display: block;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }

        .notice {
            margin-bottom: 15px;
            padding: 13px;
            border: 1px solid #bfdbfe;
            border-radius: 11px;
            background: #eff6ff;
            color: #1e40af;
            font-size: 13px;
            line-height: 1.7;
        }

        .reject-box {
            display: none;
            margin-top: 14px;
            padding: 13px;
            border: 1px solid #fecaca;
            border-radius: 11px;
            background: #fef2f2;
            color: #991b1b;
            font-size: 13px;
            line-height: 1.7;
            text-align: left;
        }

        .success-box {
            display: none;
            margin-top: 14px;
            padding: 13px;
            border: 1px solid #bbf7d0;
            border-radius: 11px;
            background: #f0fdf4;
            color: #166534;
            font-size: 13px;
            line-height: 1.7;
        }

        .actions {
            display: grid;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            min-height: 48px;
            padding: 11px 15px;
            border: 0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-btn {
            background: #2563eb;
            color: #fff;
        }

        .success-btn {
            background: #16a34a;
            color: #fff;
        }

        .secondary-btn {
            background: #fff;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .danger-btn {
            background: #dc2626;
            color: #fff;
        }

        .refresh-info {
            margin-top: 12px;
            color: #94a3b8;
            font-size: 11px;
            text-align: center;
        }

        footer {
            padding: 20px;
            color: #94a3b8;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 560px) {

            .info-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        ⏳ 人员审核状态
    </h1>

    <p>
        矿山管理系统 · 入职审核
    </p>

</header>


<main>


    <div class="notice">

        人员资料提交后需要管理员审核。

        本页面会自动检查最新审核状态。

        审核通过后可直接进入对应工作页面。

    </div>



    <section class="card">

        <div class="status-area">

            <span
                id="statusIcon"
                class="status-icon"
            >
                ⏳
            </span>

            <h2
                id="statusTitle"
                class="status-title"
            >
                等待管理员审核
            </h2>

            <p
                id="statusText"
                class="status-text"
            >
                正在读取人员审核状态……
            </p>

            <span
                id="statusBadge"
                class="badge yellow"
            >
                待审核
            </span>


            <div
                id="successBox"
                class="success-box"
            >
                审核已经通过，可以进入对应工作页面。
            </div>


            <div
                id="rejectBox"
                class="reject-box"
            >

                <strong>
                    审核未通过
                </strong>

                <div
                    id="rejectReason"
                    style="margin-top:6px;"
                >
                </div>

            </div>

        </div>

    </section>



    <section class="card">

        <h3 style="margin-top:0;">
            👤 当前申请资料
        </h3>


        <div class="info-grid">

            <div class="info-box">

                <span>
                    姓名
                </span>

                <strong id="personName">
                    -
                </strong>

            </div>


            <div class="info-box">

                <span>
                    申请岗位
                </span>

                <strong id="personPosition">
                    -
                </strong>

            </div>


            <div class="info-box">

                <span>
                    部门 / 车队
                </span>

                <strong id="personDepartment">
                    -
                </strong>

            </div>


            <div class="info-box">

                <span>
                    提交时间
                </span>

                <strong id="submittedAt">
                    -
                </strong>

            </div>

        </div>


        <div class="actions">


            <button
                id="enterWorkButton"
                type="button"
                class="success-btn"
                style="display:none;"
                onclick="enterWorkPage()"
            >
                进入工作端
            </button>


            <button
                id="editButton"
                type="button"
                class="danger-btn"
                style="display:none;"
                onclick="editRegistration()"
            >
                修改资料并重新提交
            </button>


            <button
                type="button"
                class="primary-btn"
                onclick="refreshStatus()"
            >
                🔄 手动刷新审核状态
            </button>


            <button
                type="button"
                class="secondary-btn"
                onclick="goHome()"
            >
                返回系统首页
            </button>

        </div>


        <div class="refresh-info">
            页面每5秒自动检查一次审核状态
        </div>

    </section>


</main>



<footer>
    矿山管理系统 · 审核等待页 V2.10.0V
</footer>



<script>

"use strict";


/* =========================================================
   URL 参数
========================================================= */

const params =
    new URLSearchParams(
        location.search
    );



/* =========================================================
   岗位标准化

   正式维修岗位：
   维修管理
   维修员
========================================================= */

function normalizePosition(
    position
) {

    const map = {


        "卡车司机":
            "汽车司机",


        "挖掘机司机":
            "挖机司机",


        "装载机司机":
            "铲车司机",


        "大巴":
            "大巴司机",


        "测量人员":
            "测量员",


        "后勤人员":
            "后勤",


        "库房管理员":
            "库房管理",



        /* 旧维修管理名称 */

        "维修管理员":
            "维修管理",


        "修理厂管理员":
            "维修管理",



        /* 旧维修员名称 */

        "修理工":
            "维修员",


        "维修人员":
            "维修员",



        "调度员":
            "车队长"

    };


    return (

        map[position]

        ||

        position

        ||

        ""

    );

}



/* =========================================================
   岗位页面

   维修双端口固定：
   维修管理 -> maintenance.html
   维修员 -> maintenance-worker.html
========================================================= */

const POSITION_PAGES = {


    "挖机司机":
        "excavator.html",


    "汽车司机":
        "driver-work.html",


    "铲车司机":
        "auxiliary.html",


    "加油车司机":
        "fuel.html",


    "大巴司机":
        "auxiliary.html",


    "平路机司机":
        "auxiliary.html",


    "洒水车司机":
        "auxiliary.html",


    "推土机司机":
        "auxiliary.html",


    "车队长":
        "dispatch.html",



    /* 维修 */

    "维修管理":
        "maintenance.html",


    "维修员":
        "maintenance-worker.html",



    "测量员":
        "management.html",


    "安全员":
        "management.html",


    "统计":
        "management.html",


    "会计":
        "management.html",


    "后勤":
        "management.html",


    "库房管理":
        "warehouse.html",


    "总经理":
        "general-manager.html",


    "管理员":
        "admin-review.html"

};



/* =========================================================
   需要密码验证
========================================================= */

const PASSWORD_PROTECTED_POSITIONS = [

    "总经理",

    "管理员"

];



let currentPerson =
    null;


let approvedAutoEnterTimer =
    null;


let approvedAutoEnterStarted =
    false;



/* =========================================================
   获取人员数据库
========================================================= */

function getPersonnelRecords() {

    try {

        const records =
            JSON.parse(
                localStorage.getItem(
                    "personnelRecords"
                )
            );


        return Array.isArray(
            records
        )
            ? records
            : [];


    } catch (
        error
    ) {

        console.error(
            "人员资料读取失败：",
            error
        );


        return [];

    }

}



/* =========================================================
   人员 ID
========================================================= */

function getPersonId(
    person
) {

    return String(

        person?.personId

        ||

        person?.employeeId

        ||

        person?.driverId

        ||

        person?.id

        ||

        ""

    );

}



/* =========================================================
   当前申请岗位
========================================================= */

function getSelectedPosition() {

    return normalizePosition(

        params.get(
            "position"
        )

        ||

        localStorage.getItem(
            "waitingApplicantPosition"
        )

        ||

        localStorage.getItem(
            "selectedPosition"
        )

        ||

        ""

    );

}



/* =========================================================
   查找当前人员
========================================================= */

function findCurrentPerson() {

    const records =
        getPersonnelRecords();


    const selectedPosition =
        getSelectedPosition();


    /*
     * V2.10.0V
     * 等待审核身份锁定优先级：
     *
     * 1. URL personId
     * 2. waitingApplicantPersonId
     * 3. currentPersonId
     * 4. 同岗位唯一人员
     *
     * 这样管理员登录、岗位切换或其他页面使用
     * currentPersonId 时，不会再丢失原申请人身份。
     */

    const urlPersonId =
        String(
            params.get(
                "personId"
            ) || ""
        );


    const waitingApplicantPersonId =
        String(
            localStorage.getItem(
                "waitingApplicantPersonId"
            ) || ""
        );


    const currentPersonId =
        String(
            localStorage.getItem(
                "currentPersonId"
            ) || ""
        );


    const candidateIds = [

        urlPersonId,

        waitingApplicantPersonId,

        currentPersonId

    ].filter(
        Boolean
    );


    for (
        const candidateId
        of candidateIds
    ) {

        const found =
            records.find(

                person =>

                    String(
                        getPersonId(
                            person
                        )
                    ) ===
                        String(
                            candidateId
                        )

                    &&

                    (
                        !selectedPosition

                        ||

                        normalizePosition(
                            person.position
                        ) ===
                            selectedPosition
                    )

            );


        if (
            found
        ) {

            /*
             * 一旦通过 URL 或专用等待ID找到本人，
             * 立即重新同步等待审核身份和旧兼容字段。
             */

            const personId =
                getPersonId(
                    found
                );


            const position =
                normalizePosition(
                    found.position
                );


            localStorage.setItem(
                "waitingApplicantPersonId",
                String(
                    personId
                )
            );


            localStorage.setItem(
                "waitingApplicantPosition",
                position
            );


            localStorage.setItem(
                "currentPersonId",
                String(
                    personId
                )
            );


            localStorage.setItem(
                "selectedPosition",
                position
            );


            return found;
        }
    }


    /*
     * 最后兼容：
     * 当前岗位只有1人时自动识别。
     */

    if (
        selectedPosition
    ) {

        const matches =
            records.filter(

                person =>

                    normalizePosition(
                        person.position
                    ) ===
                        selectedPosition

            );


        if (
            matches.length ===
                1
        ) {

            const found =
                matches[0];


            const personId =
                getPersonId(
                    found
                );


            localStorage.setItem(
                "waitingApplicantPersonId",
                String(
                    personId
                )
            );


            localStorage.setItem(
                "waitingApplicantPosition",
                selectedPosition
            );


            localStorage.setItem(
                "currentPersonId",
                String(
                    personId
                )
            );


            return found;
        }
    }


    return null;

}



/* =========================================================
   审核状态
========================================================= */

function getApprovalState(
    person
) {


    if (
        !person
    ) {

        return "missing";

    }


    if (

        person.status ===
            "rejected"

        ||

        person.approvalStatus ===
            "rejected"

    ) {

        return "rejected";

    }


    if (

        person.status ===
            "disabled"

        ||

        person.status ===
            "resigned"

        ||

        person.personnelStatus ===
            "停用"

        ||

        person.personnelStatus ===
            "离职"

    ) {

        return "disabled";

    }


    if (

        person.status ===
            "approved"

        ||

        person.status ===
            "active"

        ||

        person.status ===
            "working"

        ||

        person.status ===
            "leave"

        ||

        person.approvalStatus ===
            "approved"

        ||

        person.personnelStatus ===
            "在职可用"

        ||

        person.personnelStatus ===
            "作业中"

        ||

        person.personnelStatus ===
            "请假"

    ) {

        return "approved";

    }


    return "pending";

}



/* =========================================================
   刷新状态
========================================================= */

function refreshStatus() {


    currentPerson =
        findCurrentPerson();


    if (
        !currentPerson
    ) {

        renderMissing();

        return;

    }


    /*
     * 将旧岗位名称同步为标准名称
     * 仅更新当前人员。
     */

    migrateCurrentPosition(
        currentPerson
    );


    renderPersonInfo(
        currentPerson
    );


    const state =
        getApprovalState(
            currentPerson
        );


    if (
        state !==
            "approved"
    ) {

        approvedAutoEnterStarted =
            false;

        if (
            approvedAutoEnterTimer
        ) {

            clearTimeout(
                approvedAutoEnterTimer
            );

            approvedAutoEnterTimer =
                null;
        }
    }


    if (
        state ===
        "approved"
    ) {

        renderApproved(
            currentPerson
        );


        return;

    }


    if (
        state ===
        "rejected"
    ) {

        renderRejected(
            currentPerson
        );


        return;

    }


    if (
        state ===
        "disabled"
    ) {

        renderDisabled();

        return;

    }


    renderPending();

}



/* =========================================================
   当前人员旧岗位迁移

   不批量改全库，
   只统一当前人员的维修岗位名称。
========================================================= */

function migrateCurrentPosition(
    person
) {


    const oldPosition =
        person.position ||
        "";


    const normalized =
        normalizePosition(
            oldPosition
        );


    if (

        !normalized

        ||

        normalized ===
            oldPosition

    ) {

        return;

    }


    const records =
        getPersonnelRecords();


    const personId =
        getPersonId(
            person
        );


    const target =
        records.find(

            item =>

                getPersonId(
                    item
                ) ===
                    personId

        );


    if (
        !target
    ) {

        return;

    }


    target.position =
        normalized;


    target.updatedAt =
        new Date()
            .toISOString();


    localStorage.setItem(
        "personnelRecords",
        JSON.stringify(
            records
        )
    );


    person.position =
        normalized;


    localStorage.setItem(
        "selectedPosition",
        normalized
    );

}



/* =========================================================
   人员信息
========================================================= */

function renderPersonInfo(
    person
) {


    setText(
        "personName",
        person.name ||
        "-"
    );


    setText(
        "personPosition",
        normalizePosition(
            person.position
        ) ||
        "-"
    );


    setText(
        "personDepartment",
        person.department ||
        person.team ||
        "-"
    );


    setText(
        "submittedAt",
        formatDateTime(
            person.submittedAt ||
            person.createdAt
        )
    );

}



/* =========================================================
   待审核
========================================================= */

function renderPending() {


    setText(
        "statusIcon",
        "⏳"
    );


    setText(
        "statusTitle",
        "等待管理员审核"
    );


    setText(
        "statusText",
        "您的人员资料已经提交，目前正在等待管理员审核。"
    );


    const badge =
        document.getElementById(
            "statusBadge"
        );


    badge.textContent =
        "待审核";


    badge.className =
        "badge yellow";


    hideStateBoxes();


    document.getElementById(
        "enterWorkButton"
    ).style.display =
        "none";


    document.getElementById(
        "editButton"
    ).style.display =
        "none";

}



/* =========================================================
   审核通过
========================================================= */

function renderApproved(
    person
) {


    setText(
        "statusIcon",
        "✅"
    );


    setText(
        "statusTitle",
        "审核通过"
    );


    const position =
        normalizePosition(
            person.position
        );


    setText(
        "statusText",
        "您的人员资料已经通过管理员审核，可以进入“" +
        position +
        "”工作端。"
    );


    const badge =
        document.getElementById(
            "statusBadge"
        );


    badge.textContent =
        "已审核";


    badge.className =
        "badge green";


    hideStateBoxes();


    document.getElementById(
        "successBox"
    ).style.display =
        "block";


    document.getElementById(
        "enterWorkButton"
    ).style.display =
        "block";


    document.getElementById(
        "editButton"
    ).style.display =
        "none";


    scheduleApprovedAutoEnter(
        person
    );

}



/* =========================================================
   驳回
========================================================= */

function renderRejected(
    person
) {


    setText(
        "statusIcon",
        "❌"
    );


    setText(
        "statusTitle",
        "审核未通过"
    );


    setText(
        "statusText",
        "请根据管理员意见修改人员资料，然后重新提交审核。"
    );


    const badge =
        document.getElementById(
            "statusBadge"
        );


    badge.textContent =
        "已驳回";


    badge.className =
        "badge red";


    hideStateBoxes();


    const reason =

        person.rejectReason

        ||

        person.rejectionReason

        ||

        person.reviewRemark

        ||

        person.approvalRemark

        ||

        "管理员未填写驳回原因";


    document.getElementById(
        "rejectReason"
    ).textContent =
        "原因：" +
        reason;


    document.getElementById(
        "rejectBox"
    ).style.display =
        "block";


    document.getElementById(
        "enterWorkButton"
    ).style.display =
        "none";


    document.getElementById(
        "editButton"
    ).style.display =
        "block";

}



/* =========================================================
   停用 / 离职
========================================================= */

function renderDisabled() {


    setText(
        "statusIcon",
        "⛔"
    );


    setText(
        "statusTitle",
        "账号不可用"
    );


    setText(
        "statusText",
        "当前人员账号已停用或已经离职，不能进入系统。"
    );


    const badge =
        document.getElementById(
            "statusBadge"
        );


    badge.textContent =
        "不可用";


    badge.className =
        "badge gray";


    hideStateBoxes();


    document.getElementById(
        "enterWorkButton"
    ).style.display =
        "none";


    document.getElementById(
        "editButton"
    ).style.display =
        "none";

}



/* =========================================================
   找不到人员
========================================================= */

function renderMissing() {


    setText(
        "statusIcon",
        "⚠️"
    );


    setText(
        "statusTitle",
        "没有找到申请资料"
    );


    setText(
        "statusText",
        "当前浏览器中没有找到对应的人员申请记录，请返回首页重新选择岗位。"
    );


    const badge =
        document.getElementById(
            "statusBadge"
        );


    badge.textContent =
        "无资料";


    badge.className =
        "badge red";


    setText(
        "personName",
        "-"
    );


    setText(
        "personPosition",
        getSelectedPosition() ||
        "-"
    );


    setText(
        "personDepartment",
        "-"
    );


    setText(
        "submittedAt",
        "-"
    );


    hideStateBoxes();


    document.getElementById(
        "enterWorkButton"
    ).style.display =
        "none";


    document.getElementById(
        "editButton"
    ).style.display =
        "none";

}



/* =========================================================
   隐藏状态框
========================================================= */

function hideStateBoxes() {


    document.getElementById(
        "rejectBox"
    ).style.display =
        "none";


    document.getElementById(
        "successBox"
    ).style.display =
        "none";

}



/* =========================================================
   审核通过后自动进入工作端
========================================================= */

function scheduleApprovedAutoEnter(
    person
) {

    if (
        approvedAutoEnterStarted
    ) {
        return;
    }


    const position =
        normalizePosition(
            person?.position
        );


    const page =
        POSITION_PAGES[
            position
        ];


    if (
        !page
    ) {
        return;
    }


    approvedAutoEnterStarted =
        true;


    setText(
        "statusText",
        "您的人员资料已经通过管理员审核，正在进入“" +
        position +
        "”工作端……"
    );


    approvedAutoEnterTimer =
        setTimeout(
            function () {
                enterWorkPage();
            },
            1200
        );
}



/* =========================================================
   进入工作页面
========================================================= */

function enterWorkPage() {


    currentPerson =
        findCurrentPerson();


    if (
        !currentPerson
    ) {

        alert(
            "没有找到当前人员资料。"
        );

        return;

    }


    const state =
        getApprovalState(
            currentPerson
        );


    if (
        state !==
        "approved"
    ) {

        alert(
            "当前人员尚未通过管理员审核。"
        );

        return;

    }


    const position =
        normalizePosition(
            currentPerson.position
        );


    const personId =
        getPersonId(
            currentPerson
        );


    localStorage.setItem(
        "currentPersonId",
        personId
    );


    localStorage.setItem(
        "selectedPosition",
        position
    );


    /*
     * 审核已经通过，等待审核专用身份完成使命。
     * currentPersonId / selectedPosition 已经重新锁定为本人，
     * 所以这里可以安全清理等待字段。
     */
    localStorage.removeItem(
        "waitingApplicantPersonId"
    );


    localStorage.removeItem(
        "waitingApplicantPosition"
    );



    /*
     * 总经理 / 管理员
     * 进入二次密码验证
     */

    if (
        PASSWORD_PROTECTED_POSITIONS.includes(
            position
        )
    ) {


        localStorage.setItem(
            "pendingProtectedPersonId",
            personId
        );


        localStorage.setItem(
            "pendingProtectedPosition",
            position
        );


        sessionStorage.removeItem(
            "managementSession"
        );


        location.href =

            "management-login.html?position="

            +

            encodeURIComponent(
                position
            );


        return;

    }



    /*
     * 普通岗位
     * 直接分流
     */

    const page =
        POSITION_PAGES[
            position
        ];


    if (
        !page
    ) {

        alert(
            "该岗位工作页面正在建设中。"
        );

        return;

    }


    location.href =
        page;

}



/* =========================================================
   修改资料
========================================================= */

function editRegistration() {


    currentPerson =
        findCurrentPerson();


    if (
        !currentPerson
    ) {

        return;

    }


    const position =
        normalizePosition(
            currentPerson.position
        );


    localStorage.setItem(
        "currentPersonId",
        getPersonId(
            currentPerson
        )
    );


    localStorage.setItem(
        "selectedPosition",
        position
    );


    location.href =

        "person-register.html?position="

        +

        encodeURIComponent(
            position
        )

        +

        "&rejected=1";

}



/* =========================================================
   返回首页
========================================================= */

function goHome() {

    location.href =
        "index.html";

}



/* =========================================================
   工具
========================================================= */

function setText(
    id,
    value
) {

    const element =
        document.getElementById(
            id
        );


    if (
        element
    ) {

        element.textContent =
            value;

    }

}



function formatDateTime(
    value
) {


    if (
        !value
    ) {

        return "-";

    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleString(
        "zh-CN",
        {
            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    );

}



/* =========================================================
   初始化
========================================================= */

function initialize() {


    const urlPersonId =
        String(
            params.get(
                "personId"
            ) || ""
        );


    if (
        urlPersonId
    ) {

        localStorage.setItem(
            "waitingApplicantPersonId",
            urlPersonId
        );
    }


    const selectedPosition =
        getSelectedPosition();


    if (
        selectedPosition
    ) {

        localStorage.setItem(
            "waitingApplicantPosition",
            selectedPosition
        );


        localStorage.setItem(
            "selectedPosition",
            selectedPosition
        );

    }


    refreshStatus();


    setInterval(
        refreshStatus,
        5000
    );

}



initialize();

</script>
