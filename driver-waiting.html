<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>等待审核</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .waiting-card {
            text-align: center;
        }

        .waiting-icon {
            margin: 15px 0;
            font-size: 55px;
        }

        .waiting-status {
            display: inline-block;
            margin: 10px 0 20px;
            padding: 8px 18px;
            border-radius: 30px;
            color: #92400e;
            background: #fef3c7;
            font-weight: bold;
        }

        .approved-status {
            color: #166534;
            background: #dcfce7;
        }

        .rejected-status {
            color: #991b1b;
            background: #fee2e2;
        }

        .info-list {
            margin: 15px 0;
            padding: 0;
            text-align: left;
            list-style: none;
        }

        .info-list li {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 5px;
            border-bottom: 1px solid #e5e7eb;
        }

        .info-list span {
            color: #64748b;
        }

        .waiting-tip {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            color: #475569;
            background: #f8fafc;
            line-height: 1.7;
        }

        .rejected-box {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            color: #991b1b;
            background: #fef2f2;
        }

    </style>

</head>


<body>


<header>

    <h1>
        🚚 司机审核
    </h1>

    <p>
        Driver Review Status
    </p>

</header>


<main>


<section class="waiting-card">


<div
    id="waitingIcon"
    class="waiting-icon"
>
    ⏳
</div>


<h2
    id="pageTitle"
>
    资料等待审核
</h2>


<div
    id="statusBadge"
    class="waiting-status"
>
    待审核
</div>


<div
    id="driverInfo"
>


<ul class="info-list">


<li>

    <span>
        姓名
    </span>

    <strong
        id="driverName"
    >
        -
    </strong>

</li>


<li>

    <span>
        岗位
    </span>

    <strong
        id="driverPosition"
    >
        -
    </strong>

</li>


<li>

    <span>
        所属车队
    </span>

    <strong
        id="driverTeam"
    >
        -
    </strong>

</li>


<li>

    <span>
        手机号码
    </span>

    <strong
        id="driverPhone"
    >
        -
    </strong>

</li>


<li>

    <span>
        紧急联系人
    </span>

    <strong
        id="emergencyContact"
    >
        -
    </strong>

</li>


<li>

    <span>
        紧急联系电话
    </span>

    <strong
        id="emergencyPhone"
    >
        -
    </strong>

</li>


<li>

    <span>
        提交时间
    </span>

    <strong
        id="submittedAt"
    >
        -
    </strong>

</li>


</ul>


</div>


<div
    id="waitingTip"
    class="waiting-tip"
>
    您的资料已经提交成功。
    <br>
    请等待管理员审核。
    <br>
    审核通过后，再次进入司机端将自动进入司机工作台。
</div>


<div
    id="rejectedBox"
    class="rejected-box"
    style="display:none;"
>
    资料未通过审核，请修改后重新提交。
</div>


<button
    id="refreshButton"
    type="button"
>
    🔄 刷新审核状态
</button>


<button
    id="editButton"
    type="button"
    style="display:none;"
>
    ✏️ 修改资料并重新提交
</button>


<button
    type="button"
    onclick="location.href='index.html'"
>
    返回首页
</button>


</section>


</main>


<footer>

    <p>
        矿山管理系统 · 司机审核 V2.8.1
    </p>

</footer>


<script>


document.addEventListener(
    "DOMContentLoaded",
    function () {


        const refreshButton =
            document.getElementById(
                "refreshButton"
            );


        const editButton =
            document.getElementById(
                "editButton"
            );


        /*
        =================================
        初始化审核状态
        =================================
        */

        checkStatus();


        /*
        刷新
        */

        refreshButton.addEventListener(
            "click",
            function () {

                checkStatus(
                    true
                );
            }
        );


        /*
        修改资料
        */

        editButton.addEventListener(
            "click",
            function () {

                location.href =
                    "driver-register.html";
            }
        );


        /*
        =================================
        检查状态
        =================================
        */

        function checkStatus(
            showMessage
        ) {


            let profile =
                null;


            try {


                const saved =
                    localStorage.getItem(
                        "driverProfile"
                    );


                if (!saved) {


                    location.href =
                        "driver-register.html";


                    return;

                }


                profile =
                    JSON.parse(
                        saved
                    );


            } catch (error) {


                console.error(
                    "司机资料读取失败：",
                    error
                );


                localStorage.removeItem(
                    "driverProfile"
                );


                location.href =
                    "driver-register.html";


                return;

            }


            /*
            =================================
            已审核通过
            =================================
            */

            if (
                profile.status ===
                "approved"
            ) {


                document.getElementById(
                    "waitingIcon"
                ).textContent =
                    "✅";


                document.getElementById(
                    "pageTitle"
                ).textContent =
                    "审核已通过";


                const badge =
                    document.getElementById(
                        "statusBadge"
                    );


                badge.textContent =
                    "已通过";


                badge.className =
                    "waiting-status approved-status";


                document.getElementById(
                    "waitingTip"
                ).innerHTML =
                    "管理员已经批准您的人员资料。<br>正在进入司机工作台……";


                refreshButton.style.display =
                    "none";


                editButton.style.display =
                    "none";


                /*
                给司机看一下审核成功状态，
                然后进入V2.8.0工作台
                */

                setTimeout(
                    function () {

                        location.href =
                            "driver-work.html";

                    },
                    800
                );


                return;

            }


            /*
            =================================
            审核未通过
            =================================
            */

            if (
                profile.status ===
                "rejected"
            ) {


                renderProfile(
                    profile
                );


                document.getElementById(
                    "waitingIcon"
                ).textContent =
                    "❌";


                document.getElementById(
                    "pageTitle"
                ).textContent =
                    "资料需要修改";


                const badge =
                    document.getElementById(
                        "statusBadge"
                    );


                badge.textContent =
                    "未通过";


                badge.className =
                    "waiting-status rejected-status";


                document.getElementById(
                    "waitingTip"
                ).style.display =
                    "none";


                document.getElementById(
                    "rejectedBox"
                ).style.display =
                    "block";


                refreshButton.style.display =
                    "none";


                editButton.style.display =
                    "block";


                return;

            }


            /*
            =================================
            正常待审核
            =================================
            */

            if (
                profile.status ===
                "pending"
            ) {


                renderProfile(
                    profile
                );


                document.getElementById(
                    "waitingIcon"
                ).textContent =
                    "⏳";


                document.getElementById(
                    "pageTitle"
                ).textContent =
                    "资料等待审核";


                const badge =
                    document.getElementById(
                        "statusBadge"
                    );


                badge.textContent =
                    "待审核";


                badge.className =
                    "waiting-status";


                document.getElementById(
                    "waitingTip"
                ).style.display =
                    "block";


                document.getElementById(
                    "rejectedBox"
                ).style.display =
                    "none";


                refreshButton.style.display =
                    "block";


                editButton.style.display =
                    "none";


                if (showMessage) {

                    alert(
                        "管理员暂未审核，请继续等待。"
                    );
                }


                return;

            }


            /*
            未知状态
            */

            alert(
                "人员审核状态异常，请重新填写资料。"
            );


            localStorage.removeItem(
                "driverProfile"
            );


            location.href =
                "driver-register.html";

        }


        /*
        =================================
        显示人员资料
        =================================
        */

        function renderProfile(
            profile
        ) {


            setText(
                "driverName",
                profile.name ||
                "-"
            );


            setText(
                "driverPosition",
                profile.position ||
                "卡车司机"
            );


            setText(
                "driverTeam",
                profile.team ||
                "-"
            );


            setText(
                "driverPhone",
                profile.phone ||
                "-"
            );


            setText(
                "emergencyContact",
                profile.emergencyContact ||
                "-"
            );


            setText(
                "emergencyPhone",
                profile.emergencyPhone ||
                "-"
            );


            setText(
                "submittedAt",
                formatDateTime(
                    profile.submittedAt
                )
            );

        }


        function setText(
            id,
            value
        ) {


            const element =
                document.getElementById(
                    id
                );


            if (element) {

                element.textContent =
                    value;
            }

        }


        function formatDateTime(
            value
        ) {


            if (!value) {
                return "-";
            }


            const date =
                new Date(
                    value
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "-";
            }


            return date.toLocaleString(
                "zh-CN"
            );

        }

    }
);


</script>


</body>

</html>
