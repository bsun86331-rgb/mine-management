<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>等待审核</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .waiting-card {
            text-align: center;
        }

        .waiting-icon {
            margin: 15px 0;
            font-size: 55px;
        }

        .waiting-status {
            display: inline-block;
            margin: 10px 0 20px;
            padding: 8px 18px;
            border-radius: 30px;
            color: #92400e;
            background: #fef3c7;
            font-weight: bold;
        }

        .approved-status {
            color: #166534;
            background: #dcfce7;
        }

        .rejected-status {
            color: #991b1b;
            background: #fee2e2;
        }

        .info-list {
            margin: 15px 0;
            padding: 0;
            text-align: left;
            list-style: none;
        }

        .info-list li {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 5px;
            border-bottom: 1px solid #e5e7eb;
        }

        .info-list span {
            color: #64748b;
        }

        .waiting-tip {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            color: #475569;
            background: #f8fafc;
            line-height: 1.7;
        }

        .rejected-box {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            color: #991b1b;
            background: #fef2f2;
            line-height: 1.7;
        }

    </style>

</head>


<body>


<header>

    <h1>
        🚚 司机审核
    </h1>

    <p>
        Driver Review Status
    </p>

</header>


<main>


<section class="waiting-card">


<div
    id="waitingIcon"
    class="waiting-icon"
>
    ⏳
</div>


<h2
    id="pageTitle"
>
    资料等待审核
</h2>


<div
    id="statusBadge"
    class="waiting-status"
>
    待审核
</div>


<div
    id="driverInfo"
>


<ul class="info-list">


<li>

    <span>
        姓名
    </span>

    <strong
        id="driverName"
    >
        -
    </strong>

</li>


<li>

    <span>
        员工编号
    </span>

    <strong
        id="employeeNo"
    >
        待生成
    </strong>

</li>


<li>

    <span>
        岗位
    </span>

    <strong
        id="driverPosition"
    >
        -
    </strong>

</li>


<li>

    <span>
        部门 / 车队
    </span>

    <strong
        id="driverTeam"
    >
        -
    </strong>

</li>


<li>

    <span>
        手机号码
    </span>

    <strong
        id="driverPhone"
    >
        -
    </strong>

</li>


<li>

    <span>
        紧急联系人
    </span>

    <strong
        id="emergencyContact"
    >
        -
    </strong>

</li>


<li>

    <span>
        紧急联系电话
    </span>

    <strong
        id="emergencyPhone"
    >
        -
    </strong>

</li>


<li>

    <span>
        提交时间
    </span>

    <strong
        id="submittedAt"
    >
        -
    </strong>

</li>


</ul>


</div>


<div
    id="waitingTip"
    class="waiting-tip"
>
    您的资料已经提交成功。
    <br>
    请等待管理员审核。
    <br>
    系统会自动检查审核结果，审核通过后将自动进入司机工作台。
</div>


<div
    id="rejectedBox"
    class="rejected-box"
    style="display:none;"
>
    资料未通过审核，请修改后重新提交。
</div>


<button
    id="refreshButton"
    type="button"
>
    🔄 刷新审核状态
</button>


<button
    id="editButton"
    type="button"
    style="display:none;"
>
    ✏️ 修改资料并重新提交
</button>


<button
    type="button"
    onclick="location.href='index.html'"
>
    返回首页
</button>


</section>


</main>


<footer>

    <p>
        矿山管理系统 · 司机审核 V2.8.2
    </p>

</footer>


<script>


document.addEventListener(
    "DOMContentLoaded",
    function () {


        const PROFILE_KEY =
            "driverProfile";


        const PERSONNEL_KEY =
            "personnelRecords";


        const AUTO_REFRESH_MS =
            3000;


        const refreshButton =
            document.getElementById(
                "refreshButton"
            );


        const editButton =
            document.getElementById(
                "editButton"
            );


        let redirecting =
            false;


        let timer =
            null;


        /*
        =================================
        初始化审核状态
        =================================
        */

        checkStatus();


        /*
        自动轮询管理员审核结果
        */

        timer =
            setInterval(
                function () {

                    if (!redirecting) {

                        checkStatus(
                            false
                        );
                    }

                },
                AUTO_REFRESH_MS
            );


        /*
        刷新
        */

        refreshButton.addEventListener(
            "click",
            function () {

                checkStatus(
                    true
                );
            }
        );


        /*
        修改资料
        */

        editButton.addEventListener(
            "click",
            function () {

                location.href =
                    "driver-register.html";
            }
        );


        /*
        =================================
        检查状态
        =================================
        */

        function checkStatus(
            showMessage
        ) {


            let profile =
                readDriverProfile();


            if (!profile) {

                location.href =
                    "driver-register.html";

                return;
            }


            /*
            关键闭环：
            管理员审核修改的是 personnelRecords。
            等待页必须把人员总表的最新状态同步回 driverProfile。
            */

            const personnelRecord =
                findPersonnelRecord(
                    profile
                );


            if (personnelRecord) {

                profile =
                    mergeProfileFromPersonnelRecord(
                        profile,
                        personnelRecord
                    );


                saveDriverProfile(
                    profile
                );

            }


            renderProfile(
                profile
            );


            const state =
                getApprovalState(
                    profile
                );


            /*
            =================================
            已审核通过
            =================================
            */

            if (
                state ===
                "approved"
            ) {


                redirecting =
                    true;


                if (timer) {

                    clearInterval(
                        timer
                    );

                }


                document.getElementById(
                    "waitingIcon"
                ).textContent =
                    "✅";


                document.getElementById(
                    "pageTitle"
                ).textContent =
                    "审核已通过";


                const badge =
                    document.getElementById(
                        "statusBadge"
                    );


                badge.textContent =
                    "已通过";


                badge.className =
                    "waiting-status approved-status";


                document.getElementById(
                    "waitingTip"
                ).style.display =
                    "block";


                document.getElementById(
                    "waitingTip"
                ).innerHTML =
                    "管理员已经批准您的人员资料。<br>" +
                    (
                        profile.employeeNo
                            ? "员工编号：" +
                              escapeHtml(
                                  profile.employeeNo
                              ) +
                              "<br>"
                            : ""
                    ) +
                    "正在进入司机工作台……";


                document.getElementById(
                    "rejectedBox"
                ).style.display =
                    "none";


                refreshButton.style.display =
                    "none";


                editButton.style.display =
                    "none";


                /*
                保存当前人员身份，
                供后续司机工作台使用。
                */

                if (profile.personId) {

                    localStorage.setItem(
                        "currentPersonId",
                        profile.personId
                    );

                }


                localStorage.setItem(
                    "selectedPosition",
                    normalizePosition(
                        profile.position
                    ) ||
                    "汽车司机"
                );


                /*
                给司机看一下审核成功状态，
                然后进入工作台。
                */

                setTimeout(
                    function () {

                        location.href =
                            "driver-work.html";

                    },
                    800
                );


                return;

            }


            /*
            =================================
            审核未通过
            =================================
            */

            if (
                state ===
                "rejected"
            ) {


                document.getElementById(
                    "waitingIcon"
                ).textContent =
                    "❌";


                document.getElementById(
                    "pageTitle"
                ).textContent =
                    "资料需要修改";


                const badge =
                    document.getElementById(
                        "statusBadge"
                    );


                badge.textContent =
                    "未通过";


                badge.className =
                    "waiting-status rejected-status";


                document.getElementById(
                    "waitingTip"
                ).style.display =
                    "none";


                const rejectedBox =
                    document.getElementById(
                        "rejectedBox"
                    );


                const reason =
                    profile.rejectReason ||
                    profile.rejectionReason ||
                    profile.reviewRemark ||
                    "";


                rejectedBox.innerHTML =
                    reason
                        ? "资料未通过审核。<br>驳回原因：" +
                          escapeHtml(
                              reason
                          )
                        : "资料未通过审核，请修改后重新提交。";


                rejectedBox.style.display =
                    "block";


                refreshButton.style.display =
                    "none";


                editButton.style.display =
                    "block";


                return;

            }


            /*
            =================================
            正常待审核
            =================================
            */

            if (
                state ===
                "pending"
            ) {


                document.getElementById(
                    "waitingIcon"
                ).textContent =
                    "⏳";


                document.getElementById(
                    "pageTitle"
                ).textContent =
                    "资料等待审核";


                const badge =
                    document.getElementById(
                        "statusBadge"
                    );


                badge.textContent =
                    "待审核";


                badge.className =
                    "waiting-status";


                document.getElementById(
                    "waitingTip"
                ).style.display =
                    "block";


                document.getElementById(
                    "waitingTip"
                ).innerHTML =
                    "您的资料已经提交成功。<br>" +
                    "请等待管理员审核。<br>" +
                    "系统会自动检查审核结果，审核通过后将自动进入司机工作台。";


                document.getElementById(
                    "rejectedBox"
                ).style.display =
                    "none";


                refreshButton.style.display =
                    "block";


                editButton.style.display =
                    "none";


                if (showMessage) {

                    alert(
                        "管理员暂未审核，请继续等待。"
                    );
                }


                return;

            }


            /*
            停用 / 离职
            */

            if (
                state ===
                "disabled"
            ) {

                if (timer) {

                    clearInterval(
                        timer
                    );

                }


                alert(
                    "当前人员状态为停用或离职，请联系管理员。"
                );


                location.href =
                    "index.html";


                return;

            }


            /*
            未知状态
            */

            alert(
                "人员审核状态异常，请联系管理员。"
            );

        }


        /*
        =================================
        读取司机资料
        =================================
        */

        function readDriverProfile() {


            try {


                const saved =
                    localStorage.getItem(
                        PROFILE_KEY
                    );


                if (!saved) {

                    return null;
                }


                return JSON.parse(
                    saved
                );


            } catch (error) {


                console.error(
                    "司机资料读取失败：",
                    error
                );


                localStorage.removeItem(
                    PROFILE_KEY
                );


                return null;

            }

        }


        /*
        =================================
        保存司机资料
        =================================
        */

        function saveDriverProfile(
            profile
        ) {


            try {

                localStorage.setItem(
                    PROFILE_KEY,
                    JSON.stringify(
                        profile
                    )
                );


            } catch (error) {

                console.warn(
                    "司机资料同步失败：",
                    error
                );
            }

        }


        /*
        =================================
        读取人员总表
        =================================
        */

        function getPersonnelRecords() {


            try {


                const data =
                    JSON.parse(
                        localStorage.getItem(
                            PERSONNEL_KEY
                        ) ||
                        "[]"
                    );


                return Array.isArray(
                    data
                )
                    ? data
                    : [];


            } catch (error) {


                console.error(
                    "人员总表读取失败：",
                    error
                );


                return [];

            }

        }


        /*
        =================================
        从人员总表查找当前司机
        =================================
        */

        function findPersonnelRecord(
            profile
        ) {


            const records =
                getPersonnelRecords();


            return (
                records.find(
                    function (person) {


                        const samePersonId =
                            profile.personId &&
                            person.personId ===
                                profile.personId;


                        const sameDriverId =
                            profile.driverId &&
                            person.driverId ===
                                profile.driverId;


                        return (
                            samePersonId ||
                            sameDriverId
                        );

                    }
                ) ||
                null
            );

        }


        /*
        =================================
        人员总表状态同步回 driverProfile
        =================================
        */

        function mergeProfileFromPersonnelRecord(
            profile,
            record
        ) {


            return {

                ...profile,
                ...record,


                /*
                优先保留稳定身份字段
                */

                personId:
                    record.personId ||
                    profile.personId ||
                    "",

                driverId:
                    record.driverId ||
                    profile.driverId ||
                    "",

                employeeNo:
                    record.employeeNo ||
                    profile.employeeNo ||
                    "",


                /*
                部门 / 车队字段统一
                */

                team:
                    record.team ||
                    record.department ||
                    profile.team ||
                    profile.department ||
                    "",

                department:
                    record.department ||
                    record.team ||
                    profile.department ||
                    profile.team ||
                    "",


                /*
                状态字段以管理员审核结果为准
                */

                status:
                    record.status ||
                    profile.status ||
                    "pending",

                approvalStatus:
                    record.approvalStatus ||
                    profile.approvalStatus ||
                    record.status ||
                    profile.status ||
                    "pending",

                personnelStatus:
                    record.personnelStatus ||
                    profile.personnelStatus ||
                    "待审核"

            };

        }


        /*
        =================================
        统一审核状态
        =================================
        */

        function getApprovalState(
            profile
        ) {


            if (!profile) {

                return "pending";
            }


            if (
                profile.status ===
                    "rejected" ||
                profile.approvalStatus ===
                    "rejected"
            ) {

                return "rejected";
            }


            if (
                profile.status ===
                    "disabled" ||
                profile.status ===
                    "resigned" ||
                profile.personnelStatus ===
                    "停用" ||
                profile.personnelStatus ===
                    "离职"
            ) {

                return "disabled";
            }


            if (
                profile.approvalStatus ===
                    "approved" ||
                profile.status ===
                    "approved" ||
                profile.status ===
                    "active" ||
                profile.status ===
                    "working" ||
                profile.status ===
                    "leave" ||
                profile.personnelStatus ===
                    "在职可用" ||
                profile.personnelStatus ===
                    "作业中" ||
                profile.personnelStatus ===
                    "请假"
            ) {

                return "approved";
            }


            return "pending";

        }


        /*
        =================================
        岗位兼容
        =================================
        */

        function normalizePosition(
            position
        ) {


            const map = {

                "卡车司机":
                    "汽车司机",

                "汽车司机":
                    "汽车司机"

            };


            return (
                map[position] ||
                position ||
                ""
            );

        }


        /*
        =================================
        显示人员资料
        =================================
        */

        function renderProfile(
            profile
        ) {


            setText(
                "driverName",
                profile.name ||
                "-"
            );


            setText(
                "employeeNo",
                profile.employeeNo ||
                "待生成"
            );


            setText(
                "driverPosition",
                normalizePosition(
                    profile.position
                ) ||
                "汽车司机"
            );


            setText(
                "driverTeam",
                profile.team ||
                profile.department ||
                "-"
            );


            setText(
                "driverPhone",
                profile.phone ||
                "-"
            );


            setText(
                "emergencyContact",
                profile.emergencyContact ||
                "-"
            );


            setText(
                "emergencyPhone",
                profile.emergencyPhone ||
                "-"
            );


            setText(
                "submittedAt",
                formatDateTime(
                    profile.submittedAt
                )
            );

        }


        function setText(
            id,
            value
        ) {


            const element =
                document.getElementById(
                    id
                );


            if (element) {

                element.textContent =
                    value;
            }

        }


        function formatDateTime(
            value
        ) {


            if (!value) {
                return "-";
            }


            const date =
                new Date(
                    value
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "-";
            }


            return date.toLocaleString(
                "zh-CN"
            );

        }


        function escapeHtml(
            value
        ) {


            return String(
                value ?? ""
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }

    }
);


</script>


</body>

</html>
