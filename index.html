<footer>
    <p>矿山管理系统 V2.9.4B</p>
</footer>


<script>

/* =========================================================
   矿山管理系统
   统一人员入口 V2.9.4B
========================================================= */

"use strict";


/* =========================================================
   岗位 → 工作页面
========================================================= */

const POSITION_PAGES = {

    "卡车司机":
        "driver-work.html",

    "挖机司机":
        "excavator.html",

    "装载机司机":
        "auxiliary.html",

    "洒水车司机":
        "auxiliary.html",

    "加油车司机":
        "fuel.html",

    "平路机司机":
        "auxiliary.html",

    "推土机司机":
        "auxiliary.html",

    "大巴司机":
        "auxiliary.html",

    "维修人员":
        "maintenance.html",

    "库房管理员":
        "warehouse.html",

    "调度员":
        "dispatch.html",

    "车队长":
        "dispatch.html",

    "测量人员":
        "staff-work.html",

    "安全员":
        "staff-work.html",

    "后勤人员":
        "staff-work.html",

    "中层管理":
        "management.html",

    "管理员":
        "admin-review.html",

    "总经理":
        "general-manager.html"
};


/* =========================================================
   需要密码保护的岗位

   注意：
   当前只是定义权限规则。

   真正密码验证将在后续文件中建立。
   密码不会直接写在这个文件中。
========================================================= */

const PROTECTED_POSITIONS = [

    "库房管理员",
    "调度员",
    "车队长",
    "中层管理",
    "管理员",
    "总经理"

];


/* =========================================================
   选择职业
========================================================= */

function selectPosition(position) {

    if (!position) {
        return;
    }


    /*
       保存本次选择的岗位。

       下一步统一注册页面会读取：
       selectedPosition
    */

    localStorage.setItem(
        "selectedPosition",
        position
    );


    /*
       先检查本机是否已有
       与该岗位对应的人员资料。
    */

    const profile =
        findLocalProfile(position);


    /*
       没有人员资料
       → 进入统一人员资料填写页面
    */

    if (!profile) {

        goToRegistration(position);

        return;
    }


    /*
       待审核
    */

    if (
        profile.status === "pending" ||
        profile.approvalStatus === "pending"
    ) {

        goToWaiting(position);

        return;
    }


    /*
       审核驳回
       → 返回资料页面修改
    */

    if (
        profile.status === "rejected" ||
        profile.approvalStatus === "rejected"
    ) {

        goToRegistration(
            position,
            true
        );

        return;
    }


    /*
       已离职或停用
    */

    if (
        profile.status === "resigned" ||
        profile.status === "disabled"
    ) {

        alert(
            "当前账号已停用或已离职，不能进入系统。"
        );

        return;
    }


    /*
       审核通过
    */

    const approved =
        profile.status === "approved" ||
        profile.status === "active" ||
        profile.status === "working" ||
        profile.status === "leave" ||
        profile.approvalStatus === "approved";


    if (!approved) {

        goToRegistration(position);

        return;
    }


    /*
       管理岗位
       → 必须先经过密码验证

       下一版本会建立：
       management-login.html
    */

    if (
        PROTECTED_POSITIONS.includes(
            position
        )
    ) {

        enterProtectedPosition(
            position,
            profile
        );

        return;
    }


    /*
       普通岗位
       → 审核通过后进入工作页面
    */

    enterWorkPage(
        position
    );
}


/* =========================================================
   查找本机人员资料
========================================================= */

function findLocalProfile(position) {

    let personnel = [];

    try {

        personnel =
            JSON.parse(
                localStorage.getItem(
                    "personnelRecords"
                )
            ) || [];

    } catch (error) {

        console.error(
            "读取人员资料失败：",
            error
        );

        personnel = [];
    }


    /*
       当前阶段没有正式账号系统，
       优先查找本机最近使用的人员ID。
    */

    const currentPersonId =
        localStorage.getItem(
            "currentPersonId"
        );


    if (currentPersonId) {

        const current =
            personnel.find(
                person =>
                    (
                        person.personId ===
                        currentPersonId
                    ) &&
                    (
                        person.position ===
                        position
                    )
            );

        if (current) {
            return current;
        }

    }


    /*
       兼容原卡车司机 driverProfile
    */

    if (
        position === "卡车司机"
    ) {

        try {

            const driverProfile =
                JSON.parse(
                    localStorage.getItem(
                        "driverProfile"
                    )
                );

            if (
                driverProfile &&
                (
                    !driverProfile.position ||
                    driverProfile.position ===
                    "卡车司机"
                )
            ) {

                return driverProfile;
            }

        } catch (error) {

            console.error(
                "读取原司机资料失败：",
                error
            );

        }

    }


    /*
       如果本机只有一名该岗位人员，
       临时认为是当前人员。

       V3.0 接入账号系统以后，
       会改成真正的用户ID识别。
    */

    const samePosition =
        personnel.filter(
            person =>
                person.position ===
                position
        );


    if (
        samePosition.length === 1
    ) {

        return samePosition[0];

    }


    return null;
}


/* =========================================================
   进入统一人员注册
========================================================= */

function goToRegistration(
    position,
    rejected = false
) {

    /*
       卡车司机暂时继续兼容
       已经做好的注册页面。

       其他岗位下一步统一进入：
       person-register.html
    */

    if (
        position === "卡车司机"
    ) {

        location.href =
            "driver-register.html";

        return;
    }


    /*
       下一步将创建
       person-register.html

       创建完成后这里无需再次修改。
    */

    const params =
        new URLSearchParams();

    params.set(
        "position",
        position
    );


    if (rejected) {

        params.set(
            "rejected",
            "1"
        );

    }


    location.href =
        "person-register.html?" +
        params.toString();
}


/* =========================================================
   等待管理员审核
========================================================= */

function goToWaiting(position) {

    /*
       原卡车司机继续使用
       driver-waiting.html
    */

    if (
        position === "卡车司机"
    ) {

        location.href =
            "driver-waiting.html";

        return;
    }


    /*
       后续统一等待页面
    */

    const params =
        new URLSearchParams();

    params.set(
        "position",
        position
    );


    location.href =
        "person-waiting.html?" +
        params.toString();
}


/* =========================================================
   管理岗位安全验证
========================================================= */

function enterProtectedPosition(
    position,
    profile
) {

    /*
       保存准备登录的人员信息。

       注意：
       这里只保存人员ID和岗位，
       不保存密码。
    */

    const personId =
        profile.personId ||
        profile.driverId ||
        profile.id ||
        "";


    localStorage.setItem(
        "pendingProtectedPersonId",
        personId
    );


    localStorage.setItem(
        "pendingProtectedPosition",
        position
    );


    /*
       下一步后续创建：
       management-login.html

       密码验证成功以后，
       才允许进入对应管理页面。
    */

    const params =
        new URLSearchParams();

    params.set(
        "position",
        position
    );


    location.href =
        "management-login.html?" +
        params.toString();
}


/* =========================================================
   进入工作页面
========================================================= */

function enterWorkPage(position) {

    const page =
        POSITION_PAGES[position];


    if (!page) {

        alert(
            "该岗位工作页面正在建设中。"
        );

        return;
    }


    location.href = page;
}

</script>

</body>
</html>
