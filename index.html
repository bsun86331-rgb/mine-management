<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#0f172a">

    <title>矿山管理系统</title>

    <link
        rel="stylesheet"
        href="css/style.css?v=2.9.4c"
    >
</head>

<body>

<header>
    <h1>矿山管理系统</h1>
    <p>Mine Management System</p>
</header>


<main>

    <section>

        <h2>请选择登录端口</h2>

        <p style="
            text-align:center;
            color:#64748b;
            margin-bottom:20px;
        ">
            首次进入请选择本人实际岗位
        </p>


        <!-- 1 挖机司机 -->

        <button
            type="button"
            onclick="selectPosition('挖机司机')"
        >
            🚜 挖机司机
        </button>


        <!-- 2 汽车司机 -->

        <button
            type="button"
            onclick="selectPosition('汽车司机')"
        >
            🚚 汽车司机
        </button>


        <!-- 3 辅助车辆司机 -->

        <button
            type="button"
            onclick="openRoleModal('auxiliary')"
        >
            🚧 辅助车辆司机
        </button>


        <!-- 4 车队长 / 调度 -->

        <button
            type="button"
            onclick="selectPosition('车队长')"
        >
            📋 车队长 / 调度
        </button>


        <!-- 5 维修端 -->

        <button
            type="button"
            onclick="openRoleModal('maintenance')"
        >
            🔧 维修端
        </button>


        <!-- 6 中层管理 -->

        <button
            type="button"
            onclick="openRoleModal('management')"
        >
            👔 中层管理
        </button>


        <!-- 7 总经理 -->

        <button
            type="button"
            onclick="selectPosition('总经理')"
        >
            👑 总经理
        </button>


        <!-- 8 管理员 -->

        <button
            type="button"
            onclick="selectPosition('管理员')"
        >
            ⚙️ 管理员
        </button>

    </section>

</main>


<footer>
    <p>矿山管理系统 V2.9.4C</p>
</footer>


<!-- =========================================================
     二级岗位选择弹窗
========================================================= -->

<div
    id="roleModal"
    style="
        display:none;
        position:fixed;
        inset:0;
        z-index:9999;
        background:rgba(15,23,42,.65);
        align-items:center;
        justify-content:center;
        padding:20px;
    "
>

    <div
        style="
            width:min(420px,100%);
            max-height:85vh;
            overflow:auto;
            background:#fff;
            border-radius:16px;
            padding:20px;
            box-shadow:0 20px 60px rgba(0,0,0,.25);
        "
    >

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:15px;
                margin-bottom:16px;
            "
        >

            <h3
                id="roleModalTitle"
                style="margin:0;"
            >
                请选择岗位
            </h3>

            <button
                type="button"
                onclick="closeRoleModal()"
                style="
                    width:36px;
                    height:36px;
                    border:0;
                    border-radius:50%;
                    font-size:22px;
                    cursor:pointer;
                "
            >
                ×
            </button>

        </div>


        <div
            id="roleModalList"
            style="
                display:grid;
                gap:10px;
            "
        >
        </div>

    </div>

</div>


<script>

/* =========================================================
   矿山管理系统
   首页统一岗位入口 V2.9.4C
========================================================= */

"use strict";


/* =========================================================
   二级岗位
========================================================= */

const ROLE_GROUPS = {

    auxiliary: {
        title: "🚧 请选择辅助车辆岗位",
        roles: [
            "铲车司机",
            "加油车司机",
            "大巴司机",
            "平路机司机",
            "洒水车司机",
            "推土机司机"
        ]
    },

    maintenance: {
        title: "🔧 请选择维修岗位",
        roles: [
            "维修管理员",
            "修理工"
        ]
    },

    management: {
        title: "👔 请选择中层管理岗位",
        roles: [
            "测量员",
            "安全员",
            "统计",
            "会计",
            "后勤",
            "库房管理"
        ]
    }

};


/* =========================================================
   岗位对应工作页面

   目前已有页面直接使用。
   尚未建立的页面后续逐个创建。
========================================================= */

const POSITION_PAGES = {

    "挖机司机":
        "excavator.html",

    "汽车司机":
        "driver-work.html",

    "铲车司机":
        "auxiliary.html",

    "加油车司机":
        "fuel.html",

    "大巴司机":
        "auxiliary.html",

    "平路机司机":
        "auxiliary.html",

    "洒水车司机":
        "auxiliary.html",

    "推土机司机":
        "auxiliary.html",

    "车队长":
        "dispatch.html",

    "维修管理员":
        "maintenance.html",

    "修理工":
        "maintenance.html",

    "测量员":
        "management.html",

    "安全员":
        "management.html",

    "统计":
        "management.html",

    "会计":
        "management.html",

    "后勤":
        "management.html",

    "库房管理":
        "warehouse.html",

    "总经理":
        "general-manager.html",

    "管理员":
        "admin-review.html"
};


/* =========================================================
   只有这两个岗位需要二次密码验证
========================================================= */

const PASSWORD_PROTECTED_POSITIONS = [
    "总经理",
    "管理员"
];


/* =========================================================
   打开二级岗位
========================================================= */

function openRoleModal(groupName) {

    const group =
        ROLE_GROUPS[groupName];

    if (!group) {
        return;
    }


    const modal =
        document.getElementById(
            "roleModal"
        );

    const title =
        document.getElementById(
            "roleModalTitle"
        );

    const list =
        document.getElementById(
            "roleModalList"
        );


    title.textContent =
        group.title;


    list.innerHTML =
        group.roles.map(role => `
            <button
                type="button"
                onclick="selectPosition('${role}')"
                style="
                    width:100%;
                    min-height:48px;
                    padding:12px 15px;
                    border:1px solid #cbd5e1;
                    border-radius:10px;
                    background:#f8fafc;
                    color:#0f172a;
                    font-weight:700;
                    cursor:pointer;
                "
            >
                ${role}
            </button>
        `).join("");


    modal.style.display =
        "flex";
}


/* =========================================================
   关闭弹窗
========================================================= */

function closeRoleModal() {

    const modal =
        document.getElementById(
            "roleModal"
        );

    modal.style.display =
        "none";
}


/* =========================================================
   选择岗位
========================================================= */

function selectPosition(position) {

    closeRoleModal();


    localStorage.setItem(
        "selectedPosition",
        position
    );


    const profile =
        findLocalProfile(position);


    /* 没资料 → 填写资料 */

    if (!profile) {

        goToRegistration(
            position
        );

        return;
    }


    /* 待审核 */

    if (
        profile.status === "pending" ||
        profile.approvalStatus === "pending"
    ) {

        goToWaiting(
            position
        );

        return;
    }


    /* 审核驳回 */

    if (
        profile.status === "rejected" ||
        profile.approvalStatus === "rejected"
    ) {

        goToRegistration(
            position,
            true
        );

        return;
    }


    /* 停用 / 离职 */

    if (
        profile.status === "disabled" ||
        profile.status === "resigned"
    ) {

        alert(
            "当前人员状态为停用或已离职，不能进入系统。"
        );

        return;
    }


    /* 是否审核通过 */

    const approved =
        profile.status === "approved" ||
        profile.status === "active" ||
        profile.status === "working" ||
        profile.status === "leave" ||
        profile.approvalStatus === "approved";


    if (!approved) {

        goToRegistration(
            position
        );

        return;
    }


    /*
       只有：
       总经理
       管理员

       需要二次密码验证
    */

    if (
        PASSWORD_PROTECTED_POSITIONS.includes(
            position
        )
    ) {

        goToPasswordVerification(
            position,
            profile
        );

        return;
    }


    /*
       其他所有人员
       管理员审核通过后
       直接进入工作页面
    */

    enterWorkPage(
        position
    );
}


/* =========================================================
   查找本机人员资料
========================================================= */

function findLocalProfile(position) {

    let personnel = [];


    try {

        personnel =
            JSON.parse(
                localStorage.getItem(
                    "personnelRecords"
                )
            ) || [];

    } catch (error) {

        console.error(
            "人员资料读取失败：",
            error
        );

        personnel = [];
    }


    const currentPersonId =
        localStorage.getItem(
            "currentPersonId"
        );


    if (currentPersonId) {

        const current =
            personnel.find(person => {

                const id =
                    person.personId ||
                    person.driverId ||
                    person.id ||
                    "";

                return (
                    id === currentPersonId &&
                    normalizePosition(
                        person.position
                    ) === position
                );

            });


        if (current) {
            return current;
        }

    }


    /*
       兼容原汽车司机资料
    */

    if (
        position === "汽车司机"
    ) {

        try {

            const driverProfile =
                JSON.parse(
                    localStorage.getItem(
                        "driverProfile"
                    )
                );


            if (driverProfile) {

                return driverProfile;

            }

        } catch (error) {

            console.error(
                "原司机资料读取失败：",
                error
            );

        }

    }


    /*
       当前本地版临时规则：
       如果同岗位只有一个人，
       认为是当前登录人员。

       后续 Supabase 后改成正式账号。
    */

    const samePosition =
        personnel.filter(
            person =>
                normalizePosition(
                    person.position
                ) === position
        );


    if (
        samePosition.length === 1
    ) {

        return samePosition[0];

    }


    return null;
}


/* =========================================================
   兼容旧岗位名称
========================================================= */

function normalizePosition(position) {

    const map = {

        "卡车司机":
            "汽车司机",

        "装载机司机":
            "铲车司机",

        "大巴":
            "大巴司机",

        "测量人员":
            "测量员",

        "后勤人员":
            "后勤",

        "库房管理员":
            "库房管理",

        "维修人员":
            "修理工",

        "调度员":
            "车队长",

        "中层管理":
            "中层管理"
    };


    return (
        map[position] ||
        position ||
        ""
    );
}


/* =========================================================
   进入资料填写
========================================================= */

function goToRegistration(
    position,
    rejected = false
) {

    /*
       旧汽车司机页面暂时兼容。

       其他岗位统一走
       person-register.html
    */

    if (
        position === "汽车司机"
    ) {

        location.href =
            "driver-register.html";

        return;
    }


    const params =
        new URLSearchParams();


    params.set(
        "position",
        position
    );


    if (rejected) {

        params.set(
            "rejected",
            "1"
        );

    }


    location.href =
        "person-register.html?" +
        params.toString();
}


/* =========================================================
   等待审核
========================================================= */

function goToWaiting(position) {

    if (
        position === "汽车司机"
    ) {

        location.href =
            "driver-waiting.html";

        return;
    }


    const params =
        new URLSearchParams();


    params.set(
        "position",
        position
    );


    location.href =
        "person-waiting.html?" +
        params.toString();
}


/* =========================================================
   总经理 / 管理员密码验证
========================================================= */

function goToPasswordVerification(
    position,
    profile
) {

    const personId =
        profile.personId ||
        profile.driverId ||
        profile.id ||
        "";


    localStorage.setItem(
        "pendingProtectedPersonId",
        personId
    );


    localStorage.setItem(
        "pendingProtectedPosition",
        position
    );


    const params =
        new URLSearchParams();


    params.set(
        "position",
        position
    );


    location.href =
        "management-login.html?" +
        params.toString();
}


/* =========================================================
   进入对应工作页面
========================================================= */

function enterWorkPage(position) {

    const page =
        POSITION_PAGES[position];


    if (!page) {

        alert(
            "该岗位工作页面正在建设中。"
        );

        return;
    }


    location.href =
        page;
}


/* =========================================================
   点击遮罩关闭
========================================================= */

document.addEventListener(
    "click",
    function(event) {

        const modal =
            document.getElementById(
                "roleModal"
            );


        if (
            event.target === modal
        ) {

            closeRoleModal();

        }

    }
);

</script>

</body>
</html>
