<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>矿山管理系统</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================
         顶部标题
    ========================== -->

    <header>

        <h1>矿山管理系统</h1>

        <p>Mine Management System</p>

    </header>


    <!-- =========================
         登录端口
    ========================== -->

    <main>

        <section>

            <h2>请选择登录端口</h2>


            <!-- 司机端 -->

            <button
                type="button"
                onclick="location.href='driver-register.html'"
            >
                🚚 司机端
            </button>


            <!-- 挖机端 -->

            <button
                type="button"
                onclick="alert('挖机端正在建设中')"
            >
                🚜 挖机端
            </button>


            <!-- 加油端 -->

            <button
                type="button"
                onclick="alert('加油端正在建设中')"
            >
                ⛽ 加油端
            </button>


            <!-- 维修端 -->

            <button
                type="button"
                onclick="alert('维修端正在建设中')"
            >
                🔧 维修端
            </button>


            <!-- 辅助车辆端 -->

            <button
                type="button"
                onclick="alert('辅助车辆端正在建设中')"
            >
                🚧 辅助车辆端
            </button>


            <!-- 调度端 -->

            <button
                type="button"
                onclick="alert('调度端正在建设中')"
            >
                📋 调度端
            </button>


            <!-- 管理员端 -->

            <button
                type="button"
                onclick="alert('管理员端正在建设中')"
            >
                ⚙️ 管理员端
            </button>

        </section>

    </main>


    <!-- =========================
         页面底部
    ========================== -->

    <footer>

        <p>
            矿山管理系统 V1.3
        </p>

    </footer>


</body>

</html>
