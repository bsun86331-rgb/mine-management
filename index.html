<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#0f172a">

    <title>矿山管理系统</title>

    <link
        rel="stylesheet"
        href="css/style.css?v=2.9.5"
    >
</head>

<body>

<header>
    <h1>矿山管理系统</h1>
    <p>Mine Management System</p>
</header>


<main>

    <section>

        <h2>请选择登录端口</h2>

        <p style="
            text-align:center;
            color:#64748b;
            margin-bottom:20px;
        ">
            首次进入请选择本人实际岗位
        </p>


        <!-- 1 挖机司机 -->

        <button
            type="button"
            onclick="selectPosition('挖机司机')"
        >
            🚜 挖机司机
        </button>


        <!-- 2 汽车司机 -->

        <button
            type="button"
            onclick="selectPosition('汽车司机')"
        >
            🚚 汽车司机
        </button>


        <!-- 3 辅助车辆司机 -->

        <button
            type="button"
            onclick="openRoleModal('auxiliary')"
        >
            🚧 辅助车辆司机
        </button>


        <!-- 4 车队长 / 调度 -->

        <button
            type="button"
            onclick="selectPosition('车队长')"
        >
            📋 车队长 / 调度
        </button>


        <!-- 5 维修端 -->

        <button
            type="button"
            onclick="openRoleModal('maintenance')"
        >
            🔧 维修端
        </button>


        <!-- 6 中层管理 -->

        <button
            type="button"
            onclick="openRoleModal('management')"
        >
            👔 中层管理
        </button>


        <!-- 7 总经理 -->

        <button
            type="button"
            onclick="selectPosition('总经理')"
        >
            👑 总经理
        </button>


        <!-- 8 管理员 -->

        <button
            type="button"
            onclick="selectPosition('管理员')"
        >
            ⚙️ 管理员
        </button>

    </section>

</main>


<footer>
    <p>矿山管理系统 V2.9.5</p>
</footer>


<!-- =====================================================
     二级岗位选择
===================================================== -->

<div
    id="roleModal"
    style="
        display:none;
        position:fixed;
        inset:0;
        z-index:9999;
        background:rgba(15,23,42,.65);
        align-items:center;
        justify-content:center;
        padding:20px;
    "
>

    <div
        style="
            width:min(420px,100%);
            max-height:85vh;
            overflow:auto;
            background:#ffffff;
            border-radius:16px;
            padding:20px;
            box-shadow:0 20px 60px rgba(0,0,0,.25);
        "
    >

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:15px;
                margin-bottom:16px;
            "
        >

            <h3
                id="roleModalTitle"
                style="margin:0;"
            >
                请选择岗位
            </h3>

            <button
                type="button"
                onclick="closeRoleModal()"
                style="
                    width:36px;
                    height:36px;
                    border:0;
                    border-radius:50%;
                    font-size:22px;
                    cursor:pointer;
                "
            >
                ×
            </button>

        </div>


        <div
            id="roleModalList"
            style="
                display:grid;
                gap:10px;
            "
        ></div>

    </div>

</div>


<script>

"use strict";


/* =====================================================
   二级岗位
===================================================== */

const ROLE_GROUPS = {

    auxiliary: {

        title:
            "🚧 请选择辅助车辆岗位",

        roles: [
            "铲车司机",
            "加油车司机",
            "大巴司机",
            "平路机司机",
            "洒水车司机",
            "推土机司机"
        ]

    },


    maintenance: {

        title:
            "🔧 请选择维修岗位",

        roles: [
            "维修管理员",
            "修理工"
        ]

    },


    management: {

        title:
            "👔 请选择中层管理岗位",

        roles: [
            "测量员",
            "安全员",
            "统计",
            "会计",
            "后勤",
            "库房管理"
        ]

    }

};


/* =====================================================
   岗位对应工作页面
===================================================== */

const POSITION_PAGES = {

    "挖机司机":
        "excavator.html",

    "汽车司机":
        "driver-work.html",

    "铲车司机":
        "auxiliary.html",

    "加油车司机":
        "fuel.html",

    "大巴司机":
        "auxiliary.html",

    "平路机司机":
        "auxiliary.html",

    "洒水车司机":
        "auxiliary.html",

    "推土机司机":
        "auxiliary.html",

    "车队长":
        "dispatch.html",

    "维修管理员":
        "maintenance.html",

    "修理工":
        "maintenance.html",

    "测量员":
        "management.html",

    "安全员":
        "management.html",

    "统计":
        "management.html",

    "会计":
        "management.html",

    "后勤":
        "management.html",

    "库房管理":
        "warehouse.html",

    "总经理":
        "general-manager.html",

    "管理员":
        "admin-review.html"

};


/* =====================================================
   只有总经理和管理员需要密码验证
===================================================== */

const PASSWORD_PROTECTED_POSITIONS = [
    "总经理",
    "管理员"
];


/* =====================================================
   打开二级岗位选择
===================================================== */

function openRoleModal(groupName) {

    const group =
        ROLE_GROUPS[groupName];


    if (!group) {
        return;
    }


    const modal =
        document.getElementById(
            "roleModal"
        );


    const title =
        document.getElementById(
            "roleModalTitle"
        );


    const list =
        document.getElementById(
            "roleModalList"
        );


    title.textContent =
        group.title;


    list.innerHTML =
        group.roles.map(role => `

            <button
                type="button"
                onclick="selectPosition('${role}')"
                style="
                    width:100%;
                    min-height:50px;
                    padding:12px 15px;
                    border:1px solid #cbd5e1;
                    border-radius:10px;
                    background:#f8fafc;
                    color:#0f172a;
                    font-size:16px;
                    font-weight:700;
                    cursor:pointer;
                "
            >
                ${role}
            </button>

        `).join("");


    modal.style.display =
        "flex";

}


/* =====================================================
   关闭二级岗位选择
===================================================== */

function closeRoleModal() {

    document.getElementById(
        "roleModal"
    ).style.display =
        "none";

}


/* =====================================================
   岗位名称兼容
===================================================== */

function normalizePosition(position) {

    const map = {

        "卡车司机":
            "汽车司机",

        "装载机司机":
            "铲车司机",

        "大巴":
            "大巴司机",

        "测量人员":
            "测量员",

        "后勤人员":
            "后勤",

        "库房管理员":
            "库房管理",

        "维修人员":
            "修理工",

        "调度员":
            "车队长"

    };


    return (
        map[position] ||
        position ||
        ""
    );

}


/* =====================================================
   获取统一人员库
===================================================== */

function getPersonnelRecords() {

    try {

        const records =
            JSON.parse(
                localStorage.getItem(
                    "personnelRecords"
                )
            );


        return Array.isArray(records)
            ? records
            : [];


    } catch (error) {

        console.error(
            "人员资料读取失败：",
            error
        );


        return [];

    }

}


/* =====================================================
   查找当前登录人员

   所有岗位，包括汽车司机，
   都只使用 personnelRecords。
===================================================== */

function findCurrentProfile(position) {

    const records =
        getPersonnelRecords();


    const currentPersonId =
        localStorage.getItem(
            "currentPersonId"
        );


    /*
       第一优先：
       使用当前人员ID查找
    */

    if (currentPersonId) {

        const current =
            records.find(person => {

                const personId =
                    person.personId ||
                    person.driverId ||
                    person.id ||
                    "";


                return (
                    personId === currentPersonId &&
                    normalizePosition(
                        person.position
                    ) === position
                );

            });


        if (current) {

            return current;

        }

    }


    /*
       当前 localStorage 测试阶段：

       如果本机该岗位只有一名人员，
       可以自动识别。

       后续接 Supabase 后，
       使用正式账号ID识别。
    */

    const samePosition =
        records.filter(person =>

            normalizePosition(
                person.position
            ) === position

        );


    if (
        samePosition.length === 1
    ) {

        return samePosition[0];

    }


    return null;

}


/* =====================================================
   选择岗位
===================================================== */

function selectPosition(position) {

    closeRoleModal();


    localStorage.setItem(
        "selectedPosition",
        position
    );


    const profile =
        findCurrentProfile(
            position
        );


    /*
       没有资料
       → 所有人统一填写入职资料
    */

    if (!profile) {

        goToRegistration(
            position
        );

        return;

    }


    /*
       保存当前人员ID
    */

    const personId =
        profile.personId ||
        profile.driverId ||
        profile.id ||
        "";


    if (personId) {

        localStorage.setItem(
            "currentPersonId",
            personId
        );

    }


    /*
       待管理员审核
    */

    if (
        profile.status === "pending" ||
        profile.approvalStatus === "pending" ||
        profile.personnelStatus === "待审核"
    ) {

        goToWaiting(
            position
        );

        return;

    }


    /*
       管理员驳回
       → 修改资料重新提交
    */

    if (
        profile.status === "rejected" ||
        profile.approvalStatus === "rejected"
    ) {

        goToRegistration(
            position,
            true
        );

        return;

    }


    /*
       停用 / 离职
    */

    if (
        profile.status === "disabled" ||
        profile.status === "resigned" ||
        profile.personnelStatus === "停用" ||
        profile.personnelStatus === "离职"
    ) {

        alert(
            "当前人员已停用或离职，不能进入系统。"
        );

        return;

    }


    /*
       判断管理员是否已经审核通过
    */

    const approved =

        profile.approvalStatus ===
            "approved" ||

        profile.status ===
            "approved" ||

        profile.status ===
            "active" ||

        profile.status ===
            "working" ||

        profile.status ===
            "leave" ||

        profile.personnelStatus ===
            "在职可用" ||

        profile.personnelStatus ===
            "作业中" ||

        profile.personnelStatus ===
            "请假";


    /*
       未审核通过
       → 统一等待管理员审核
    */

    if (!approved) {

        goToWaiting(
            position
        );

        return;

    }


    /*
       总经理 / 管理员

       审核通过后
       还必须进行密码验证
    */

    if (
        PASSWORD_PROTECTED_POSITIONS.includes(
            position
        )
    ) {

        goToPasswordVerification(
            position,
            profile
        );

        return;

    }


    /*
       其他所有岗位

       管理员审核通过后
       直接进入自己的工作页面
    */

    enterWorkPage(
        position
    );

}


/* =====================================================
   所有人统一进入入职资料页面
===================================================== */

function goToRegistration(
    position,
    rejected = false
) {

    const params =
        new URLSearchParams();


    params.set(
        "position",
        position
    );


    if (rejected) {

        params.set(
            "rejected",
            "1"
        );

    }


    location.href =
        "person-register.html?" +
        params.toString();

}


/* =====================================================
   所有人统一进入等待审核页面
===================================================== */

function goToWaiting(position) {

    const params =
        new URLSearchParams();


    params.set(
        "position",
        position
    );


    location.href =
        "person-waiting.html?" +
        params.toString();

}


/* =====================================================
   总经理 / 管理员密码验证
===================================================== */

function goToPasswordVerification(
    position,
    profile
) {

    const personId =
        profile.personId ||
        profile.driverId ||
        profile.id ||
        "";


    localStorage.setItem(
        "pendingProtectedPersonId",
        personId
    );


    localStorage.setItem(
        "pendingProtectedPosition",
        position
    );


    const params =
        new URLSearchParams();


    params.set(
        "position",
        position
    );


    location.href =
        "management-login.html?" +
        params.toString();

}


/* =====================================================
   进入工作页面
===================================================== */

function enterWorkPage(position) {

    const page =
        POSITION_PAGES[position];


    if (!page) {

        alert(
            "该岗位工作页面正在建设中。"
        );

        return;

    }


    location.href =
        page;

}


/* =====================================================
   点击黑色遮罩关闭二级菜单
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        const modal =
            document.getElementById(
                "roleModal"
            );


        if (
            event.target === modal
        ) {

            closeRoleModal();

        }

    }
);

</script>

</body>
</html>
