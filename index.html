<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>矿山管理系统</title>

    <link
        rel="stylesheet"
        href="css/style.css?v=2.9.4a"
    >
</head>

<body>

<header>
    <h1>矿山管理系统</h1>
    <p>Mine Management System</p>
</header>


<main>

    <section>

        <h2>请选择登录端口</h2>


        <!-- =========================
             司机端
        ========================== -->

        <button
            type="button"
            onclick="enterDriverPortal()"
        >
            🚚 司机端
        </button>


        <!-- =========================
             挖机端
        ========================== -->

        <button
            type="button"
            onclick="alert('挖机端正在建设中')"
        >
            🚜 挖机端
        </button>


        <!-- =========================
             加油端
        ========================== -->

        <button
            type="button"
            onclick="alert('加油端正在建设中')"
        >
            ⛽ 加油端
        </button>


        <!-- =========================
             维修端
        ========================== -->

        <button
            type="button"
            onclick="alert('维修端正在建设中')"
        >
            🔧 维修端
        </button>


        <!-- =========================
             辅助车辆端
        ========================== -->

        <button
            type="button"
            onclick="alert('辅助车辆端正在建设中')"
        >
            🚧 辅助车辆端
        </button>


        <!-- =========================
             调度端
        ========================== -->

        <button
            type="button"
            onclick="location.href='dispatch.html'"
        >
            📋 调度端
        </button>


        <!-- =========================
             管理员审核
        ========================== -->

        <button
            type="button"
            onclick="location.href='admin-review.html'"
        >
            ⚙️ 管理员端
        </button>


        <!-- =========================
             基础资料中心
             V2.9.4A
        ========================== -->

        <button
            type="button"
            onclick="location.href='admin-master.html'"
        >
            🗂️ 基础资料中心
        </button>


        <!-- =========================
             总经理端
        ========================== -->

        <button
            type="button"
            onclick="enterGeneralManagerPortal()"
        >
            👔 总经理端
        </button>

    </section>

</main>


<footer>
    <p>矿山管理系统 V2.9.4A</p>
</footer>


<script>

/* =========================================================
   矿山管理系统
   首页 V2.9.4A
========================================================= */


/* =========================================================
   司机入口

   没注册
   → 注册

   待审核
   → 等待审核

   已通过
   → 工作页面

   已驳回
   → 修改资料重新提交
========================================================= */

function enterDriverPortal() {

    let profile = null;

    try {

        const saved =
            localStorage.getItem(
                "driverProfile"
            );

        if (saved) {
            profile =
                JSON.parse(saved);
        }

    } catch (error) {

        console.error(
            "司机资料读取失败：",
            error
        );

        localStorage.removeItem(
            "driverProfile"
        );

        location.href =
            "driver-register.html";

        return;
    }


    /* 没有注册资料 */

    if (!profile) {

        location.href =
            "driver-register.html";

        return;
    }


    /* 等待审核 */

    if (
        profile.status ===
        "pending"
    ) {

        location.href =
            "driver-waiting.html";

        return;
    }


    /* 审核通过 */

    if (
        profile.status ===
        "approved"
    ) {

        location.href =
            "driver-work.html";

        return;
    }


    /* 审核未通过 */

    if (
        profile.status ===
        "rejected"
    ) {

        location.href =
            "driver-register.html";

        return;
    }


    /* 未知状态 */

    location.href =
        "driver-register.html";
}


/* =========================================================
   总经理入口

   当前 V2.9.4A 阶段：
   如果总经理页面已经存在，
   直接进入。

   后续 V2.9.5 再统一做
   总经理注册 / 登录 / 权限。
========================================================= */

function enterGeneralManagerPortal() {

    location.href =
        "general-manager.html";
}

</script>

</body>
</html>
