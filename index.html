<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#0f172a">

    <title>矿山管理系统</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f1f5f9;
            color: #0f172a;
            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;
        }

        header {
            padding: 28px 16px 24px;
            background: #0f172a;
            color: #ffffff;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 13px;
            opacity: .78;
        }

        main {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 20px 14px 36px;
        }

        .welcome {
            margin-bottom: 18px;
            padding: 16px;
            border-radius: 14px;
            background: #ffffff;
            box-shadow:
                0 5px 20px
                rgba(15, 23, 42, .06);
        }

        .welcome-title {
            margin: 0 0 6px;
            font-size: 17px;
            font-weight: 700;
        }

        .welcome-text {
            margin: 0;
            color: #64748b;
            font-size: 13px;
            line-height: 1.65;
        }

        .portal-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .portal-card {
            min-height: 126px;
            padding: 18px 14px;
            border: 0;
            border-radius: 16px;
            background: #ffffff;
            color: #0f172a;
            box-shadow:
                0 5px 20px
                rgba(15, 23, 42, .06);
            text-align: center;
            cursor: pointer;
            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }

        .portal-card:active {
            transform: scale(.98);
        }

        .portal-icon {
            display: block;
            margin-bottom: 9px;
            font-size: 36px;
        }

        .portal-title {
            display: block;
            margin-bottom: 5px;
            font-size: 17px;
            font-weight: 700;
        }

        .portal-subtitle {
            display: block;
            color: #64748b;
            font-size: 12px;
            line-height: 1.45;
        }

        .admin-card {
            border: 1px solid #cbd5e1;
        }

        footer {
            padding: 20px 15px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }


        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            padding: 20px 14px;
            background: rgba(15, 23, 42, .6);
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            border-radius: 18px;
            background: #ffffff;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .modal-title {
            margin: 0;
            font-size: 20px;
        }

        .close-btn {
            width: 38px;
            height: 38px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: #f1f5f9;
            color: #334155;
            font-size: 20px;
            cursor: pointer;
        }

        .role-list {
            display: grid;
            gap: 10px;
        }

        .role-btn {
            width: 100%;
            min-height: 52px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            background: #ffffff;
            color: #0f172a;
            text-align: left;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .role-btn:active {
            background: #f8fafc;
        }


        @media (max-width: 520px) {

            .portal-grid {
                grid-template-columns: 1fr;
            }

            .portal-card {
                min-height: 105px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        ⛏️ 矿山管理系统
    </h1>

    <p>
        Mine Management System
    </p>

</header>


<main>


    <section class="welcome">

        <p class="welcome-title">
            请选择您的工作岗位
        </p>

        <p class="welcome-text">
            首次使用需要填写个人资料并提交管理员审核。
            审核通过后，再次点击自己的岗位即可进入对应工作页面。
        </p>

    </section>


    <section class="portal-grid">


        <button
            type="button"
            class="portal-card"
            onclick="selectPosition('挖机司机')"
        >

            <span class="portal-icon">
                🚜
            </span>

            <span class="portal-title">
                挖机司机
            </span>

            <span class="portal-subtitle">
                挖掘机作业端
            </span>

        </button>


        <button
            type="button"
            class="portal-card"
            onclick="selectPosition('汽车司机')"
        >

            <span class="portal-icon">
                🚚
            </span>

            <span class="portal-title">
                汽车司机
            </span>

            <span class="portal-subtitle">
                运输车辆司机端
            </span>

        </button>


        <button
            type="button"
            class="portal-card"
            onclick="openRoleModal('auxiliary')"
        >

            <span class="portal-icon">
                🚧
            </span>

            <span class="portal-title">
                辅助车辆司机
            </span>

            <span class="portal-subtitle">
                铲车 · 加油车 · 大巴 · 平路机等
            </span>

        </button>


        <button
            type="button"
            class="portal-card"
            onclick="selectPosition('车队长')"
        >

            <span class="portal-icon">
                📋
            </span>

            <span class="portal-title">
                车队长 / 调度
            </span>

            <span class="portal-subtitle">
                生产任务与车辆调度
            </span>

        </button>


        <button
            type="button"
            class="portal-card"
            onclick="openRoleModal('maintenance')"
        >

            <span class="portal-icon">
                🔧
            </span>

            <span class="portal-title">
                维修端
            </span>

            <span class="portal-subtitle">
                维修管理员 · 修理工
            </span>

        </button>


        <button
            type="button"
            class="portal-card"
            onclick="openRoleModal('management')"
        >

            <span class="portal-icon">
                👔
            </span>

            <span class="portal-title">
                中层管理
            </span>

            <span class="portal-subtitle">
                测量 · 安全 · 统计 · 会计 · 后勤等
            </span>

        </button>


        <button
            type="button"
            class="portal-card"
            onclick="selectPosition('总经理')"
        >

            <span class="portal-icon">
                👑
            </span>

            <span class="portal-title">
                总经理
            </span>

            <span class="portal-subtitle">
                高权限管理与审批
            </span>

        </button>


        <button
            type="button"
            class="portal-card admin-card"
            onclick="selectPosition('管理员')"
        >

            <span class="portal-icon">
                ⚙️
            </span>

            <span class="portal-title">
                管理员
            </span>

            <span class="portal-subtitle">
                人员审核与基础资料管理
            </span>

        </button>


    </section>


</main>


<footer>
    矿山管理系统 · 首页 V2.9.7
</footer>


<div
    class="modal"
    id="roleModal"
    onclick="handleModalBackground(event)"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2
                class="modal-title"
                id="roleModalTitle"
            >
                选择岗位
            </h2>

            <button
                type="button"
                class="close-btn"
                onclick="closeRoleModal()"
            >
                ×
            </button>

        </div>


        <div
            class="role-list"
            id="roleList"
        >
        </div>

    </div>

</div>


<script>

"use strict";


const POSITION_PAGES = {

    "挖机司机":
        "excavator.html",

    "汽车司机":
        "driver-work.html",

    "铲车司机":
        "auxiliary.html",

    "加油车司机":
        "fuel.html",

    "大巴司机":
        "auxiliary.html",

    "平路机司机":
        "auxiliary.html",

    "洒水车司机":
        "auxiliary.html",

    "推土机司机":
        "auxiliary.html",

    "车队长":
        "dispatch.html",

    "维修管理员":
        "maintenance.html",

    "修理工":
        "maintenance.html",

    "测量员":
        "management.html",

    "安全员":
        "management.html",

    "统计":
        "management.html",

    "会计":
        "management.html",

    "后勤":
        "management.html",

    "库房管理":
        "warehouse.html",

    "总经理":
        "general-manager.html",

    "管理员":
        "admin-review.html"

};


const PASSWORD_PROTECTED_POSITIONS = [
    "总经理",
    "管理员"
];


const ROLE_GROUPS = {

    auxiliary: {

        title:
            "选择辅助车辆岗位",

        roles: [
            "铲车司机",
            "加油车司机",
            "大巴司机",
            "平路机司机",
            "洒水车司机",
            "推土机司机"
        ]

    },


    maintenance: {

        title:
            "选择维修岗位",

        roles: [
            "维修管理员",
            "修理工"
        ]

    },


    management: {

        title:
            "选择中层管理岗位",

        roles: [
            "测量员",
            "安全员",
            "统计",
            "会计",
            "后勤",
            "库房管理"
        ]

    }

};


function normalizePosition(position) {

    const map = {

        "卡车司机":
            "汽车司机",

        "装载机司机":
            "铲车司机",

        "大巴":
            "大巴司机",

        "测量人员":
            "测量员",

        "后勤人员":
            "后勤",

        "库房管理员":
            "库房管理",

        "维修人员":
            "修理工",

        "调度员":
            "车队长"

    };


    return (
        map[position] ||
        position ||
        ""
    );

}


function getPersonnelRecords() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    "personnelRecords"
                )
            );


        return Array.isArray(data)
            ? data
            : [];


    } catch (error) {

        console.error(
            "人员资料读取失败：",
            error
        );


        return [];

    }

}


function getPersonId(person) {

    return (

        person?.personId ||

        person?.driverId ||

        person?.id ||

        ""

    );

}


function getApprovalState(person) {

    if (!person) {

        return "missing";

    }


    if (
        person.status === "rejected" ||
        person.approvalStatus === "rejected"
    ) {

        return "rejected";

    }


    if (
        person.status === "disabled" ||
        person.status === "resigned" ||
        person.personnelStatus === "停用" ||
        person.personnelStatus === "离职"
    ) {

        return "disabled";

    }


    const approved = (

        person.approvalStatus ===
            "approved" ||

        person.status ===
            "approved" ||

        person.status ===
            "active" ||

        person.status ===
            "working" ||

        person.status ===
            "leave" ||

        person.personnelStatus ===
            "在职可用" ||

        person.personnelStatus ===
            "作业中" ||

        person.personnelStatus ===
            "请假"

    );


    if (approved) {

        return "approved";

    }


    return "pending";

}


/* =========================================================
   是否已经存在已审核管理员
========================================================= */

function hasApprovedAdministrator() {

    return getPersonnelRecords()
        .some(
            person =>

                normalizePosition(
                    person.position
                ) === "管理员" &&

                getApprovalState(
                    person
                ) === "approved"
        );

}


/* =========================================================
   查找当前岗位人员
========================================================= */

function findCurrentProfile(position) {

    const normalizedPosition =
        normalizePosition(
            position
        );


    const records =
        getPersonnelRecords();


    const currentPersonId =
        localStorage.getItem(
            "currentPersonId"
        );


    if (currentPersonId) {

        const person =
            records.find(
                item =>

                    getPersonId(item) ===
                        currentPersonId &&

                    normalizePosition(
                        item.position
                    ) ===
                        normalizedPosition
            );


        if (person) {

            return person;

        }

    }


    const samePosition =
        records.filter(
            item =>
                normalizePosition(
                    item.position
                ) ===
                    normalizedPosition
        );


    if (
        samePosition.length === 1
    ) {

        return samePosition[0];

    }


    return null;

}


/* =========================================================
   点击岗位
========================================================= */

function selectPosition(position) {

    const normalizedPosition =
        normalizePosition(
            position
        );


    if (!normalizedPosition) {

        return;

    }


    closeRoleModal();


    localStorage.setItem(
        "selectedPosition",
        normalizedPosition
    );


    /* =====================================================
       首个管理员特殊入口

       如果系统当前没有任何已审核管理员：

       点击“管理员”
       不进入注册页
       直接进入管理员密码验证页。

       management-login.html
       会负责建立首个管理员。
    ====================================================== */

    if (
        normalizedPosition ===
            "管理员" &&

        !hasApprovedAdministrator()
    ) {

        clearManagementSession();


        localStorage.setItem(
            "pendingProtectedPosition",
            "管理员"
        );


        localStorage.removeItem(
            "pendingProtectedPersonId"
        );


        location.href =

            "management-login.html?position=" +

            encodeURIComponent(
                "管理员"
            );


        return;

    }


    const person =
        findCurrentProfile(
            normalizedPosition
        );


    const state =
        getApprovalState(
            person
        );


    /*
       没有档案：

       普通人员和后续管理员
       都进入统一人员登记页。
    */

    if (
        state === "missing"
    ) {

        clearManagementSession();


        location.href =

            "person-register.html?position=" +

            encodeURIComponent(
                normalizedPosition
            );


        return;

    }


    const personId =
        getPersonId(
            person
        );


    if (personId) {

        localStorage.setItem(
            "currentPersonId",
            personId
        );

    }


    if (
        state === "rejected"
    ) {

        clearManagementSession();


        location.href =

            "person-register.html?position=" +

            encodeURIComponent(
                normalizedPosition
            ) +

            "&rejected=1";


        return;

    }


    if (
        state === "disabled"
    ) {

        clearManagementSession();


        alert(
            "该人员账号已停用或已经离职，不能进入系统。"
        );


        return;

    }


    if (
        state === "pending"
    ) {

        clearManagementSession();


        location.href =

            "person-waiting.html?position=" +

            encodeURIComponent(
                normalizedPosition
            );


        return;

    }


    if (
        state === "approved"
    ) {

        enterApprovedPosition(
            person,
            normalizedPosition
        );

    }

}


/* =========================================================
   审核通过后进入岗位
========================================================= */

function enterApprovedPosition(
    person,
    position
) {

    const personId =
        getPersonId(
            person
        );


    if (!personId) {

        alert(
            "当前人员缺少人员ID，请重新提交人员资料。"
        );


        return;

    }


    localStorage.setItem(
        "currentPersonId",
        personId
    );


    localStorage.setItem(
        "selectedPosition",
        position
    );


    if (
        PASSWORD_PROTECTED_POSITIONS.includes(
            position
        )
    ) {

        if (
            hasValidManagementSession(
                personId,
                position
            )
        ) {

            const page =
                POSITION_PAGES[position];


            if (page) {

                location.href =
                    page;

            }


            return;

        }


        localStorage.setItem(
            "pendingProtectedPersonId",
            personId
        );


        localStorage.setItem(
            "pendingProtectedPosition",
            position
        );


        location.href =

            "management-login.html?position=" +

            encodeURIComponent(
                position
            );


        return;

    }


    clearManagementSession();


    const page =
        POSITION_PAGES[position];


    if (!page) {

        alert(
            "该岗位工作页面正在建设中。"
        );


        return;

    }


    location.href =
        page;

}


/* =========================================================
   检查管理会话
========================================================= */

function hasValidManagementSession(
    personId,
    position
) {

    try {

        const session =
            JSON.parse(
                sessionStorage.getItem(
                    "managementSession"
                )
            );


        if (!session) {

            return false;

        }


        return (

            session.verified === true &&

            session.personId ===
                personId &&

            normalizePosition(
                session.position
            ) ===
                normalizePosition(
                    position
                ) &&

            Number(
                session.expiresAt
            ) >
                Date.now()

        );


    } catch (error) {

        sessionStorage.removeItem(
            "managementSession"
        );


        return false;

    }

}


/* =========================================================
   清理管理会话
========================================================= */

function clearManagementSession() {

    sessionStorage.removeItem(
        "managementSession"
    );


    localStorage.removeItem(
        "pendingProtectedPersonId"
    );


    localStorage.removeItem(
        "pendingProtectedPosition"
    );

}


/* =========================================================
   打开岗位选择弹窗
========================================================= */

function openRoleModal(groupName) {

    const group =
        ROLE_GROUPS[groupName];


    if (!group) {

        return;

    }


    document.getElementById(
        "roleModalTitle"
    ).textContent =
        group.title;


    const container =
        document.getElementById(
            "roleList"
        );


    container.innerHTML =
        group.roles
            .map(
                role => `

                    <button
                        type="button"
                        class="role-btn"
                        onclick="selectPosition('${role}')"
                    >
                        ${role}
                    </button>

                `
            )
            .join("");


    document.getElementById(
        "roleModal"
    ).classList.add(
        "show"
    );

}


/* =========================================================
   关闭岗位弹窗
========================================================= */

function closeRoleModal() {

    document.getElementById(
        "roleModal"
    ).classList.remove(
        "show"
    );

}


/* =========================================================
   点击背景关闭
========================================================= */

function handleModalBackground(event) {

    if (
        event.target.id ===
        "roleModal"
    ) {

        closeRoleModal();

    }

}


/* =========================================================
   ESC关闭
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeRoleModal();

        }

    }
);

</script>


</body>
</html>
