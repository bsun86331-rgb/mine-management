<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打印预览 · 矿山管理系统</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#eef2f7;
      color:#111827;
      font-family:Arial,"Microsoft YaHei",sans-serif;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 18px;
      background:#0f172a;
      color:#fff;
      box-shadow:0 2px 10px rgba(15,23,42,.18);
    }
    .topbar strong{font-size:16px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    button{
      min-height:38px;
      padding:0 14px;
      border:0;
      border-radius:9px;
      font-weight:800;
      cursor:pointer;
    }
    .back{background:#e2e8f0;color:#0f172a}
    .print{background:#2563eb;color:#fff}
    .sheet{
      width:min(900px,calc(100% - 24px));
      margin:20px auto;
      padding:30px;
      background:#fff;
      border-radius:14px;
      box-shadow:0 10px 30px rgba(15,23,42,.10);
    }
    .empty{
      padding:40px 15px;
      text-align:center;
      color:#64748b;
    }
    h1{text-align:center;margin:0 0 22px}
    table{width:100%;border-collapse:collapse}
    td{border:1px solid #d1d5db;padding:10px;vertical-align:top}
    td:first-child{width:30%;font-weight:700;background:#f3f4f6}
    .photo{margin-bottom:30px;page-break-inside:avoid}
    .photo h2{font-size:17px;margin:0 0 10px}
    .photo img{display:block;max-width:100%;max-height:780px;margin:0 auto;border-radius:8px}
    .photo-empty{padding:30px;text-align:center;color:#64748b;background:#f8fafc;border-radius:10px}
    @media print{
      body{background:#fff}
      .topbar{display:none!important}
      .sheet{
        width:100%;
        margin:0;
        padding:0;
        border-radius:0;
        box-shadow:none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <strong>🖨 打印预览</strong>
    <div class="actions">
      <button class="back" type="button" onclick="goBack()">← 返回审核页</button>
      <button class="print" type="button" onclick="window.print()">打印</button>
    </div>
  </header>

  <main id="printSheet" class="sheet">
    <div class="empty">正在加载打印内容...</div>
  </main>

  <script>
    const KEY="minePrintPreviewPayload";

    function escapeHtml(value){
      return String(value??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function readPayload(){
      try{
        return JSON.parse(sessionStorage.getItem(KEY)||"null");
      }catch(error){
        return null;
      }
    }

    function readPersonnel(){
      try{
        const list=JSON.parse(localStorage.getItem("personnelRecords")||"[]");
        return Array.isArray(list)?list:[];
      }catch(error){
        return [];
      }
    }

    function getPersonId(person){
      return String(
        person?.personId||
        person?.driverId||
        person?.employeeId||
        person?.id||
        ""
      );
    }

    function findPerson(personId){
      return readPersonnel().find(person=>getPersonId(person)===String(personId||""))||null;
    }

    function statusText(person){
      const value=String(person?.approvalStatus||person?.status||"");
      const map={
        approved:"已通过",
        pending:"待审核",
        rejected:"已驳回",
        active:"在职可用",
        working:"作业中",
        disabled:"停用",
        resigned:"已离职"
      };
      return map[value]||value||"-";
    }

    function goBack(){
      const payload=readPayload();
      location.href=(payload&&payload.returnUrl)||"admin-review.html";
    }

    function renderProfile(person){
      const bankName=person.bankName||"-";
      return `
        <h1>矿山管理系统人员资料</h1>
        <table>
          <tr><td>姓名</td><td>${escapeHtml(person.name||"-")}</td></tr>
          <tr><td>员工编号</td><td>${escapeHtml(person.employeeNo||person.employeeId||"待生成")}</td></tr>
          <tr><td>手机号</td><td>${escapeHtml(person.phone||"-")}</td></tr>
          <tr><td>岗位</td><td>${escapeHtml(person.position||"-")}</td></tr>
          <tr><td>人员类别</td><td>${escapeHtml(person.personnelCategory||"-")}</td></tr>
          <tr><td>部门 / 车队</td><td>${escapeHtml(person.department||person.team||"-")}</td></tr>
          <tr><td>入职日期</td><td>${escapeHtml(person.entryDate||"-")}</td></tr>
          <tr><td>身份证号</td><td>${escapeHtml(person.idCardNumber||"-")}</td></tr>
          <tr><td>护照号</td><td>${escapeHtml(person.passportNumber||"-")}</td></tr>
          <tr><td>银行卡号</td><td>${escapeHtml(person.bankCardNumber||"-")}</td></tr>
          <tr><td>开户行</td><td>${escapeHtml(bankName)}</td></tr>
          <tr><td>紧急联系人</td><td>${escapeHtml(person.emergencyContact||"-")}</td></tr>
          <tr><td>紧急联系电话</td><td>${escapeHtml(person.emergencyPhone||"-")}</td></tr>
          <tr><td>审核状态</td><td>${escapeHtml(statusText(person))}</td></tr>
          <tr><td>备注</td><td>${escapeHtml(person.remark||"-")}</td></tr>
        </table>
      `;
    }

    function renderPhotos(person){
      const photos=[
        ["本人自拍 / 人员头像",person.selfiePhoto||person.profilePhoto||person.avatarPhoto],
        ["身份证照片",person.idCardPhoto],
        ["护照照片",person.passportPhoto],
        ["驾驶证 / 操作证",person.driverLicensePhoto||person.licensePhoto],
        ["银行卡照片",person.bankCardPhoto]
      ].filter(item=>item[1]);

      if(!photos.length){
        return `
          <h1>${escapeHtml(person.name||"人员")} · 证件照片</h1>
          <div class="photo-empty">该人员没有上传照片。</div>
        `;
      }

      return `
        <h1>${escapeHtml(person.name||"人员")} · 证件照片</h1>
        ${photos.map(item=>`
          <section class="photo">
            <h2>${escapeHtml(item[0])}</h2>
            <img src="${item[1]}" alt="${escapeHtml(item[0])}">
          </section>
        `).join("")}
      `;
    }

    function render(){
      const payload=readPayload();
      const sheet=document.getElementById("printSheet");

      if(!payload){
        sheet.innerHTML='<div class="empty">没有找到打印任务。请返回审核页面重新点击打印。</div>';
        return;
      }

      const person=findPerson(payload.personId);

      if(!person){
        sheet.innerHTML='<div class="empty">没有找到对应人员资料。请返回审核页面重新选择人员。</div>';
        return;
      }

      if(payload.type==="photos"){
        document.title=(person.name||"人员")+" · 照片打印预览";
        sheet.innerHTML=renderPhotos(person);
      }else{
        document.title=(person.name||"人员")+" · 资料打印预览";
        sheet.innerHTML=renderProfile(person);
      }
    }

    render();
  </script>
</body>
</html>
