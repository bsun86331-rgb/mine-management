<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打印预览 · 矿山管理系统</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#eef2f7;
      color:#111827;
      font-family:Arial,"Microsoft YaHei",sans-serif;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 18px;
      background:#0f172a;
      color:#fff;
      box-shadow:0 2px 10px rgba(15,23,42,.18);
    }
    .topbar strong{font-size:16px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    button{
      min-height:38px;
      padding:0 14px;
      border:0;
      border-radius:9px;
      font-weight:800;
      cursor:pointer;
    }
    .back{background:#e2e8f0;color:#0f172a}
    .print{background:#2563eb;color:#fff}
    .sheet{
      width:min(900px,calc(100% - 24px));
      margin:20px auto;
      padding:30px;
      background:#fff;
      border-radius:14px;
      box-shadow:0 10px 30px rgba(15,23,42,.10);
    }
    .empty{
      padding:40px 15px;
      text-align:center;
      color:#64748b;
    }
    @media print{
      body{background:#fff}
      .topbar{display:none!important}
      .sheet{
        width:100%;
        margin:0;
        padding:0;
        border-radius:0;
        box-shadow:none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <strong>🖨 打印预览</strong>
    <div class="actions">
      <button class="back" type="button" onclick="goBack()">← 返回审核页</button>
      <button class="print" type="button" onclick="window.print()">打印</button>
    </div>
  </header>

  <main id="printSheet" class="sheet">
    <div class="empty">正在加载打印内容...</div>
  </main>

  <script>
    const KEY="minePrintPreviewPayload";

    function goBack(){
      const payload=readPayload();
      location.href=(payload&&payload.returnUrl)||"admin-review.html";
    }

    function readPayload(){
      try{
        return JSON.parse(sessionStorage.getItem(KEY)||"null");
      }catch(error){
        return null;
      }
    }

    function render(){
      const payload=readPayload();
      const sheet=document.getElementById("printSheet");

      if(!payload||!payload.html){
        sheet.innerHTML='<div class="empty">没有找到打印内容。请返回审核页面重新点击打印。</div>';
        return;
      }

      document.title=(payload.title||"打印预览")+" · 矿山管理系统";
      sheet.innerHTML=payload.html;
    }

    render();
  </script>
</body>
</html>
