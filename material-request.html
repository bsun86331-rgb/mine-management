<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">

    <title>全员后勤物资领用中心 - 矿山管理系统</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --dark: #0f172a;
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--dark);
            color: #fff;
            box-shadow: 0 5px 18px rgba(15, 23, 42, .18);
        }

        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 16px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 5px 0 0;
            color: #cbd5e1;
            font-size: 12px;
        }

        button {
            border: 0;
            border-radius: 10px;
            min-height: 42px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .header-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
        }

        .primary-btn {
            background: var(--primary);
            color: #fff;
        }

        .success-btn {
            background: var(--success);
            color: #fff;
        }

        .secondary-btn {
            background: #fff;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        main {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 16px 14px 40px;
        }

        .notice {
            margin-bottom: 14px;
            padding: 13px 14px;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            background: #eff6ff;
            color: #1e40af;
            font-size: 13px;
            line-height: 1.75;
        }

        .card {
            margin-bottom: 14px;
            padding: 17px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 5px 20px rgba(15, 23, 42, .06);
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 18px;
        }

        .section-title p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge.green {
            background: #dcfce7;
            color: #166534;
        }

        .badge.yellow {
            background: #fef3c7;
            color: #92400e;
        }

        .badge.red {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge.gray {
            background: #e2e8f0;
            color: #475569;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .info-box {
            padding: 12px;
            border-radius: 11px;
            background: #f8fafc;
        }

        .info-box span {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .info-box strong {
            display: block;
            font-size: 15px;
            word-break: break-word;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 42px;
            padding: 9px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
        }

        textarea {
            min-height: 88px;
            resize: vertical;
        }

        .material-info {
            margin-top: 10px;
            padding: 12px;
            border-radius: 11px;
            background: #f8fafc;
            color: #475569;
            font-size: 12px;
            line-height: 1.7;
        }

        .request-list {
            display: grid;
            gap: 10px;
        }

        .request-card {
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: #f8fafc;
        }

        .request-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .request-card h3 {
            margin: 0;
            font-size: 15px;
        }

        .request-info {
            margin-top: 8px;
            color: #475569;
            font-size: 12px;
            line-height: 1.8;
        }

        .empty {
            padding: 25px 10px;
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
        }

        .footer-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        footer {
            padding: 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 720px) {
            .profile-grid,
            .grid-2,
            .grid-3,
            .footer-actions {
                grid-template-columns: 1fr;
            }

            .header-inner {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div>
            <h1>🧾 全员后勤物资领用中心</h1>
            <p>Material Request Center · V2.10.1C</p>
        </div>

        <button type="button" class="header-btn" onclick="goHome()">首页</button>
    </div>
</header>

<main>

    <div class="notice">
        所有已审核入职人员均可提交后勤物资领用申请。后勤管理确认无误后填写实际发放数量并出库。
        可回收物资支持普通领用和以旧换新。
    </div>

    <section class="card">
        <div class="section-title">
            <div>
                <h2>👤 当前申请人</h2>
                <p>自动读取当前已审核人员信息。</p>
            </div>

            <span id="approvalBadge" class="badge gray">识别中</span>
        </div>

        <div class="profile-grid">
            <div class="info-box">
                <span>姓名</span>
                <strong id="personName">-</strong>
            </div>

            <div class="info-box">
                <span>岗位</span>
                <strong id="personPosition">-</strong>
            </div>

            <div class="info-box">
                <span>部门 / 车队</span>
                <strong id="personDepartment">-</strong>
            </div>

            <div class="info-box">
                <span>人员编号</span>
                <strong id="personId">-</strong>
            </div>
        </div>
    </section>

    <section class="card">
        <div class="section-title">
            <div>
                <h2>📦 新建物料领用单</h2>
                <p>选择标准物资资料，填写申请数量、用途及领用方式。</p>
            </div>
        </div>

        <div class="grid-3">
            <div class="form-group">
                <label>物资 *</label>
                <select id="materialSelect" onchange="renderSelectedMaterialInfo()"></select>
            </div>

            <div class="form-group">
                <label>申请数量 *</label>
                <input id="requestQuantity" type="number" min="1" step="1" value="1">
            </div>

            <div class="form-group">
                <label>领用方式 *</label>
                <select id="requestType">
                    <option value="normal">普通领用</option>
                    <option value="exchange">以旧换新</option>
                </select>
            </div>
        </div>

        <div id="materialInfo" class="material-info">
            请选择物资。
        </div>

        <div class="form-group" style="margin-top:12px;">
            <label>用途 *</label>
            <textarea id="purpose" placeholder="例如：日常劳保使用 / 工作需要 / 原物资损坏换新"></textarea>
        </div>

        <div class="form-group">
            <label>备注</label>
            <textarea id="remark" placeholder="其他需要说明的情况"></textarea>
        </div>

        <button type="button" class="primary-btn" onclick="submitRequest()">提交物料领用单</button>
    </section>

    <section class="card">
        <div class="section-title">
            <div>
                <h2>📋 我的领用申请</h2>
                <p>查看申请状态、实际发放数量和驳回原因。</p>
            </div>
        </div>

        <div id="myRequestList" class="request-list"></div>
    </section>

    <div class="footer-actions">
        <button type="button" class="secondary-btn" onclick="goBack()">返回上一页</button>
        <button type="button" class="secondary-btn" onclick="goHome()">返回系统首页</button>
    </div>

</main>

<footer>
    矿山管理系统 · 全员后勤物资领用中心 V2.10.1C
</footer>

<script>
"use strict";

const STORAGE = {
    MATERIALS: "warehouseMaterials",
    REQUESTS: "materialRequests"
};

let currentPerson = null;

function normalizePosition(position) {
    const map = {
        "卡车司机": "汽车司机",
        "挖掘机司机": "挖机司机",
        "装载机司机": "铲车司机",
        "大巴": "大巴司机",
        "测量人员": "测量员",
        "安全人员": "安全员",
        "后勤人员": "后勤",
        "库房管理员": "库房管理",
        "维修管理员": "维修管理",
        "修理厂管理员": "维修管理",
        "修理工": "维修员",
        "维修人员": "维修员",
        "调度员": "车队长"
    };

    return map[position] || position || "";
}

function getPersonId(person) {
    return String(
        person?.personId ||
        person?.employeeId ||
        person?.driverId ||
        person?.id ||
        ""
    );
}

function getPersonnelRecords() {
    try {
        const data = JSON.parse(localStorage.getItem("personnelRecords"));
        return Array.isArray(data) ? data : [];
    } catch (error) {
        console.error(error);
        return [];
    }
}

function isApproved(person) {
    if (!person) return false;

    if (
        person.status === "rejected" ||
        person.approvalStatus === "rejected" ||
        person.status === "disabled" ||
        person.status === "resigned" ||
        person.personnelStatus === "停用" ||
        person.personnelStatus === "离职"
    ) {
        return false;
    }

    return (
        person.approvalStatus === "approved" ||
        person.status === "approved" ||
        person.status === "active" ||
        person.status === "working" ||
        person.status === "leave" ||
        person.personnelStatus === "在职可用" ||
        person.personnelStatus === "作业中" ||
        person.personnelStatus === "请假"
    );
}

function findCurrentPerson() {
    const records = getPersonnelRecords();
    const currentPersonId = String(localStorage.getItem("currentPersonId") || "");
    const selectedPosition = normalizePosition(localStorage.getItem("selectedPosition") || "");

    if (currentPersonId) {
        const found = records.find(person =>
            getPersonId(person) === currentPersonId &&
            (!selectedPosition || normalizePosition(person.position) === selectedPosition)
        );

        if (found) return found;
    }

    if (selectedPosition) {
        const matches = records.filter(person =>
            normalizePosition(person.position) === selectedPosition &&
            isApproved(person)
        );

        if (matches.length === 1) return matches[0];
    }

    return null;
}

function verifyAccess() {
    currentPerson = findCurrentPerson();

    if (!currentPerson) {
        alert("没有找到当前人员资料，请从系统首页重新进入。");
        location.replace("index.html");
        return false;
    }

    if (!isApproved(currentPerson)) {
        const personId = getPersonId(currentPerson);
        const position = normalizePosition(currentPerson.position);

        localStorage.setItem("waitingApplicantPersonId", personId);
        localStorage.setItem("waitingApplicantPosition", position);

        location.replace(
            "person-waiting.html?position=" +
            encodeURIComponent(position) +
            "&personId=" +
            encodeURIComponent(personId)
        );

        return false;
    }

    return true;
}

function readArray(key) {
    try {
        const data = JSON.parse(localStorage.getItem(key));
        return Array.isArray(data) ? data : [];
    } catch (error) {
        console.error(error);
        return [];
    }
}

function saveArray(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
}

function createId(prefix) {
    return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
}

function getMaterials() {
    return readArray(STORAGE.MATERIALS).filter(item => item.status !== "disabled");
}

function renderProfile() {
    document.getElementById("personName").textContent = currentPerson.name || "-";
    document.getElementById("personPosition").textContent = normalizePosition(currentPerson.position) || "-";
    document.getElementById("personDepartment").textContent = currentPerson.department || currentPerson.team || "-";
    document.getElementById("personId").textContent = getPersonId(currentPerson) || "-";

    const badge = document.getElementById("approvalBadge");
    badge.textContent = "已审核";
    badge.className = "badge green";
}

function renderMaterialOptions() {
    const materials = getMaterials();
    const select = document.getElementById("materialSelect");

    select.innerHTML =
        '<option value="">请选择物资</option>' +
        materials.map(item =>
            `<option value="${escapeHtml(item.materialId)}">${escapeHtml(item.code || "")} · ${escapeHtml(item.name || "")}</option>`
        ).join("");
}

function renderSelectedMaterialInfo() {
    const materialId = document.getElementById("materialSelect").value;
    const material = getMaterials().find(item => item.materialId === materialId);
    const box = document.getElementById("materialInfo");

    if (!material) {
        box.textContent = "请选择物资。";
        return;
    }

    box.innerHTML = `
        <strong>${escapeHtml(material.name || "-")}</strong><br>
        编码：${escapeHtml(material.code || "-")}<br>
        分类：${escapeHtml(material.category || "-")}<br>
        规格：${escapeHtml(material.spec || "-")}<br>
        单位：${escapeHtml(material.unit || "-")}<br>
        属性：${material.type === "recyclable" ? "可回收物资" : "普通消耗物资"}<br>
        当前可用库存：${Number(material.availableQty || 0)}
    `;

    const requestType = document.getElementById("requestType");

    if (material.type !== "recyclable") {
        requestType.value = "normal";
        requestType.querySelector('option[value="exchange"]').disabled = true;
    } else {
        requestType.querySelector('option[value="exchange"]').disabled = false;
    }
}

function submitRequest() {
    const materialId = document.getElementById("materialSelect").value;
    const quantity = Number(document.getElementById("requestQuantity").value || 0);
    const requestType = document.getElementById("requestType").value;
    const purpose = document.getElementById("purpose").value.trim();
    const remark = document.getElementById("remark").value.trim();

    if (!materialId) {
        alert("请选择物资。");
        return;
    }

    if (!quantity || quantity <= 0) {
        alert("请填写正确的申请数量。");
        return;
    }

    if (!purpose) {
        alert("请填写领用用途。");
        return;
    }

    const material = getMaterials().find(item => item.materialId === materialId);

    if (!material) {
        alert("没有找到该物资资料。");
        return;
    }

    if (requestType === "exchange" && material.type !== "recyclable") {
        alert("普通消耗物资不能选择以旧换新。");
        return;
    }

    const requests = readArray(STORAGE.REQUESTS);

    const request = {
        requestId: createId("REQ"),
        personId: getPersonId(currentPerson),
        personName: currentPerson.name || "",
        applicantName: currentPerson.name || "",
        position: normalizePosition(currentPerson.position),
        applicantPosition: normalizePosition(currentPerson.position),
        department: currentPerson.department || currentPerson.team || "",
        materialId: material.materialId,
        materialCode: material.code || "",
        materialName: material.name || "",
        materialType: material.type || "consumable",
        unit: material.unit || "",
        requestQuantity: quantity,
        quantity,
        requestType,
        purpose,
        remark,
        status: "pending",
        createdAt: new Date().toISOString(),
        submittedAt: new Date().toISOString()
    };

    requests.push(request);
    saveArray(STORAGE.REQUESTS, requests);

    document.getElementById("requestQuantity").value = "1";
    document.getElementById("requestType").value = "normal";
    document.getElementById("purpose").value = "";
    document.getElementById("remark").value = "";

    renderMyRequests();

    alert("物料领用单已提交，等待后勤管理确认出库。");
}

function renderMyRequests() {
    const personId = getPersonId(currentPerson);

    const requests = readArray(STORAGE.REQUESTS)
        .filter(item => String(item.personId || "") === personId)
        .slice()
        .reverse();

    const box = document.getElementById("myRequestList");

    if (!requests.length) {
        box.innerHTML = '<div class="empty">暂无领用申请</div>';
        return;
    }

    box.innerHTML = requests.map(item => {
        const state = getRequestState(item);

        return `
            <div class="request-card">
                <div class="request-top">
                    <h3>${escapeHtml(item.materialName || "-")} · ${Number(item.requestQuantity || item.quantity || 0)} ${escapeHtml(item.unit || "")}</h3>
                    <span class="badge ${state.className}">${state.text}</span>
                </div>

                <div class="request-info">
                    领用方式：${item.requestType === "exchange" ? "以旧换新" : "普通领用"}<br>
                    用途：${escapeHtml(item.purpose || "-")}<br>
                    提交时间：${formatDateTime(item.createdAt || item.submittedAt)}<br>
                    ${item.status === "issued" ? "实际发放：" + Number(item.actualQuantity || 0) + " " + escapeHtml(item.unit || "") + "<br>" : ""}
                    ${item.rejectReason ? "驳回原因：" + escapeHtml(item.rejectReason) + "<br>" : ""}
                    备注：${escapeHtml(item.remark || "-")}
                </div>
            </div>
        `;
    }).join("");
}

function getRequestState(item) {
    if (item.status === "issued") {
        return { text: "已出库", className: "green" };
    }

    if (item.status === "rejected") {
        return { text: "已驳回", className: "red" };
    }

    return { text: "待后勤处理", className: "yellow" };
}

function formatDateTime(value) {
    if (!value) return "-";

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "-";

    return date.toLocaleString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
}

function goBack() {
    history.length > 1 ? history.back() : goHome();
}

function goHome() {
    location.href = "index.html";
}

if (verifyAccess()) {
    renderProfile();
    renderMaterialOptions();
    renderSelectedMaterialInfo();
    renderMyRequests();
}
</script>

</body>

</html>
