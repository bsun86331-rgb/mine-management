<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>司机资料登记</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header>

    <h1>🚚 司机资料登记</h1>

    <p>
        Driver Registration
    </p>

</header>


<main>


<section>


<h2>
    人员基本信息
</h2>


<p
    id="rejectedNotice"
    style="
        display:none;
        padding:12px;
        background:#fff3cd;
        color:#856404;
        border-radius:8px;
        margin-bottom:15px;
    "
>
    上次提交的资料未通过审核，
    请修改资料后重新提交。
</p>


<form
    id="driverRegisterForm"
    autocomplete="off"
>


<label for="name">
    姓名 *
</label>

<input
    id="name"
    type="text"
    placeholder="请输入姓名"
    required
>


<label for="phone">
    手机号码 *
</label>

<input
    id="phone"
    type="tel"
    placeholder="请输入手机号码"
    required
>


<label for="emergencyContact">
    紧急联系人 *
</label>

<input
    id="emergencyContact"
    type="text"
    placeholder="请输入紧急联系人姓名"
    required
>


<label for="emergencyPhone">
    紧急联系人电话 *
</label>

<input
    id="emergencyPhone"
    type="tel"
    placeholder="请输入紧急联系人电话号码"
    required
>


<label for="idCardNumber">
    身份证号码
</label>

<input
    id="idCardNumber"
    type="text"
    placeholder="身份证 / 护照至少填写一项"
>


<label for="passportNumber">
    护照号码
</label>

<input
    id="passportNumber"
    type="text"
    placeholder="身份证 / 护照至少填写一项"
>


<label for="bankCardNumber">
    银行卡号码
</label>

<input
    id="bankCardNumber"
    type="text"
    placeholder="请输入银行卡号码"
>


<label for="position">
    工作岗位 *
</label>

<input
    id="position"
    type="text"
    value="卡车司机"
    readonly
>


<label for="team">
    所属车队 *
</label>

<input
    id="team"
    type="text"
    placeholder="例如：运输一队"
    required
>


<label for="entryDate">
    入职日期
</label>

<input
    id="entryDate"
    type="date"
>


<hr>


<h2>
    证件照片
</h2>


<label for="idCardPhoto">
    身份证照片
</label>

<input
    id="idCardPhoto"
    type="file"
    accept="image/*"
>


<label for="passportPhoto">
    护照照片
</label>

<input
    id="passportPhoto"
    type="file"
    accept="image/*"
>


<label for="driverLicensePhoto">
    驾驶证照片
</label>

<input
    id="driverLicensePhoto"
    type="file"
    accept="image/*"
>


<label for="bankCardPhoto">
    银行卡照片
</label>

<input
    id="bankCardPhoto"
    type="file"
    accept="image/*"
>


<label for="remark">
    备注
</label>

<textarea
    id="remark"
    rows="4"
    placeholder="其他需要说明的信息"
></textarea>


<button
    id="submitButton"
    type="button"
>
    提交审核
</button>


<button
    type="button"
    onclick="location.href='index.html'"
>
    返回首页
</button>


</form>


</section>


</main>


<footer>

    <p>
        矿山管理系统 · 司机资料登记 V2.8.1
    </p>

</footer>


<script
    src="js/driver-register.js?v=2.8.1"
></script>


</body>

</html>
