<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#0f172a"
>

<title>
    维修员工作端 - 矿山管理系统
</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

header {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 16px 14px;
    background: #0f172a;
    color: #ffffff;
    box-shadow:
        0 4px 18px
        rgba(15,23,42,.2);
}

.header-inner {
    max-width: 1000px;
    margin: 0 auto;
}

.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 5px 0 0;
    color: #cbd5e1;
    font-size: 12px;
}

main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 14px 14px 40px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px 15px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.header-btn {
    background: #1e293b;
    border: 1px solid #475569;
    color: #fff;
}

.primary-btn {
    background: #2563eb;
    color: white;
}

.success-btn {
    background: #16a34a;
    color: white;
}

.warning-btn {
    background: #f59e0b;
    color: white;
}

.danger-btn {
    background: #dc2626;
    color: white;
}

.secondary-btn {
    background: white;
    color: #334155;
    border: 1px solid #cbd5e1;
}

.card {
    margin-bottom: 14px;
    padding: 17px;
    border-radius: 16px;
    background: #ffffff;
    box-shadow:
        0 5px 20px
        rgba(15,23,42,.06);
}

.section-title {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.section-title h2 {
    margin: 0;
    font-size: 18px;
}

.section-title p {
    margin: 5px 0 0;
    color: #64748b;
    font-size: 12px;
    line-height: 1.6;
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
}

.badge.default {
    background: #e2e8f0;
    color: #475569;
}

.badge.green {
    background: #dcfce7;
    color: #166534;
}

.badge.yellow {
    background: #fef3c7;
    color: #92400e;
}

.badge.red {
    background: #fee2e2;
    color: #991b1b;
}

.badge.blue {
    background: #dbeafe;
    color: #1e40af;
}

.badge.purple {
    background: #ede9fe;
    color: #6d28d9;
}

.badge.orange {
    background: #ffedd5;
    color: #9a3412;
}

.info-grid {
    display: grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));
    gap: 10px;
}

.info-box {
    padding: 12px;
    border-radius: 11px;
    background: #f8fafc;
}

.info-box span {
    display: block;
    margin-bottom: 5px;
    color: #64748b;
    font-size: 12px;
}

.info-box strong {
    display: block;
    font-size: 15px;
    word-break: break-word;
}

.summary-grid {
    display: grid;
    grid-template-columns:
        repeat(4,minmax(0,1fr));
    gap: 10px;
}

.summary-card {
    padding: 14px 12px;
    border-radius: 13px;
    background: #f8fafc;
}

.summary-card span {
    display: block;
    color: #64748b;
    font-size: 12px;
}

.summary-card strong {
    display: block;
    margin-top: 7px;
    font-size: 24px;
}

.nav-grid {
    display: grid;
    grid-template-columns:
        repeat(4,minmax(0,1fr));
    gap: 8px;
    margin-bottom: 14px;
}

.nav-btn {
    min-height: 58px;
    padding: 10px;
    background: white;
    color: #334155;
    border: 1px solid #e2e8f0;
}

.nav-btn.active {
    background: #0f172a;
    color: white;
}

.page-section {
    display: none;
}

.page-section.active {
    display: block;
}

.record-list {
    display: grid;
    gap: 10px;
}

.record-card {
    padding: 14px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #f8fafc;
}

.record-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
}

.record-info {
    margin-top: 9px;
    color: #64748b;
    font-size: 12px;
    line-height: 1.8;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 11px;
}

.form-group {
    margin-bottom: 13px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 700;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    background: white;
    font-size: 14px;
    outline: none;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: #2563eb;
    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.08);
}

.photo-box {
    margin-top: 12px;
    padding: 13px;
    border: 1px dashed #94a3b8;
    border-radius: 12px;
    background: #f8fafc;
}

.photo-preview {
    display: none;
    width: 100%;
    max-height: 320px;
    margin-top: 10px;
    border-radius: 10px;
    object-fit: contain;
    background: #0f172a;
}

.notice {
    margin-bottom: 14px;
    padding: 13px;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    background: #eff6ff;
    color: #1e40af;
    font-size: 13px;
    line-height: 1.7;
}

.warning-box {
    margin-top: 10px;
    padding: 12px;
    border: 1px solid #fed7aa;
    border-radius: 10px;
    background: #fff7ed;
    color: #9a3412;
    font-size: 12px;
    line-height: 1.7;
}

.empty {
    padding: 30px 12px;
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.8;
}

.work-clock {
    margin-top: 12px;
    padding: 18px 14px;
    border-radius: 13px;
    background: #0f172a;
    color: white;
    text-align: center;
}

.work-clock span {
    display: block;
    color: #cbd5e1;
    font-size: 12px;
}

.work-clock strong {
    display: block;
    margin-top: 7px;
    font-size: 30px;
}

footer {
    padding: 20px;
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
}

@media(max-width:720px) {

    .nav-grid,
    .summary-grid {
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<script>

"use strict";


const STORAGE = {

    PERSONNEL:
        "personnelRecords",

    REQUESTS:
        "maintenanceRequests",

    WORK_ORDERS:
        "maintenanceWorkOrders",

    BAYS:
        "workshopBays",

    DRAFTS:
        "maintenanceWorkerDrafts"

};



let currentWorker =
    null;


let currentOrder =
    null;


let pendingBeforePhoto =
    "";


let pendingAfterPhoto =
    "";



/* =========================================================
   岗位统一
========================================================= */

function normalizePosition(
    position
) {

    const map = {

        "维修管理员":
            "维修管理",

        "修理厂管理员":
            "维修管理",

        "修理工":
            "维修员",

        "维修人员":
            "维修员"

    };


    return (

        map[position] ||

        position ||

        ""

    );

}



/* =========================================================
   人员数据
========================================================= */

function getPersonnelRecords() {

    return readArray(
        STORAGE.PERSONNEL
    );

}



function getPersonId(
    person
) {

    return String(

        person?.personId ||

        person?.employeeId ||

        person?.driverId ||

        person?.id ||

        ""

    );

}



/* =========================================================
   是否为已审核人员
========================================================= */

function isApproved(
    person
) {

    if (
        !person
    ) {

        return false;

    }


    if (

        person.status ===
            "rejected"

        ||

        person.approvalStatus ===
            "rejected"

        ||

        person.status ===
            "disabled"

        ||

        person.status ===
            "resigned"

        ||

        person.personnelStatus ===
            "停用"

        ||

        person.personnelStatus ===
            "离职"

    ) {

        return false;

    }


    return (

        person.approvalStatus ===
            "approved"

        ||

        person.status ===
            "approved"

        ||

        person.status ===
            "active"

        ||

        person.status ===
            "working"

        ||

        person.status ===
            "leave"

        ||

        person.personnelStatus ===
            "在职可用"

        ||

        person.personnelStatus ===
            "作业中"

        ||

        person.personnelStatus ===
            "请假"

    );

}



/* =========================================================
   当前维修员
========================================================= */

function getCurrentWorker() {

    const records =
        getPersonnelRecords();


    const currentPersonId =
        localStorage.getItem(
            "currentPersonId"
        ) || "";


    const selectedPosition =
        normalizePosition(

            localStorage.getItem(
                "selectedPosition"
            ) || ""

        );



    /*
     * 优先按照 currentPersonId 找人
     */

    if (
        currentPersonId
    ) {

        const found =
            records.find(

                item =>

                    getPersonId(
                        item
                    ) ===
                        String(
                            currentPersonId
                        )

            );


        if (
            found
        ) {

            const position =
                normalizePosition(
                    found.position
                );


            if (
                position !==
                    "维修员"
            ) {

                return null;

            }


            if (
                !isApproved(
                    found
                )
            ) {

                return null;

            }


            /*
             * 把旧岗位名称升级成正式名称
             */

            if (
                found.position !==
                    "维修员"
            ) {

                found.position =
                    "维修员";


                found.updatedAt =
                    new Date()
                        .toISOString();


                save(
                    STORAGE.PERSONNEL,
                    records
                );

            }


            localStorage.setItem(
                "selectedPosition",
                "维修员"
            );


            return found;

        }

    }



    /*
     * currentPersonId 丢失时，
     * 只有从“维修员”入口进入才允许自动匹配。
     */

    if (
        selectedPosition !==
            "维修员"
    ) {

        return null;

    }


    const workers =
        records.filter(

            item =>

                normalizePosition(
                    item.position
                ) ===
                    "维修员"

                &&

                isApproved(
                    item
                )

        );


    /*
     * 只有一个维修员时自动识别。
     */

    if (
        workers.length !==
            1
    ) {

        return null;

    }


    const worker =
        workers[0];


    const personId =
        getPersonId(
            worker
        );


    if (
        personId
    ) {

        localStorage.setItem(
            "currentPersonId",
            personId
        );

    }


    if (
        worker.position !==
            "维修员"
    ) {

        worker.position =
            "维修员";


        worker.updatedAt =
            new Date()
                .toISOString();


        save(
            STORAGE.PERSONNEL,
            records
        );

    }


    return worker;

}



/* =========================================================
   岗位访问保护
========================================================= */

function verifyWorkerAccess() {

    const worker =
        getCurrentWorker();


    if (
        worker
    ) {

        currentWorker =
            worker;


        return true;

    }


    const selectedPosition =
        normalizePosition(

            localStorage.getItem(
                "selectedPosition"
            ) || ""

        );


    if (
        selectedPosition ===
            "维修管理"
    ) {

        alert(
            "当前账号是维修管理，请进入维修管理端。"
        );


        location.replace(
            "index.html"
        );


        return false;

    }


    alert(
        "没有找到已审核的维修员资料，请先从首页进入并完成入职审核。"
    );


    location.replace(
        "index.html"
    );


    return false;

}



/* =========================================================
   初始化
========================================================= */

function initialize() {

    bindNavigation();


    currentWorker =
        getCurrentWorker();


    renderWorker();


    renderAll();


    setInterval(

        function () {

            const latestWorker =
                getCurrentWorker();


            if (
                !latestWorker
            ) {

                alert(
                    "当前维修员账号状态已经发生变化，请重新登录。"
                );


                location.replace(
                    "index.html"
                );


                return;

            }


            currentWorker =
                latestWorker;


            renderAll();

        },

        5000

    );

}



if (
    verifyWorkerAccess()
) {

    initialize();

}



/* =========================================================
   导航
========================================================= */

function bindNavigation() {

    document
        .querySelectorAll(
            "[data-page]"
        )
        .forEach(

            button => {

                button.addEventListener(

                    "click",

                    function () {

                        openPage(
                            button.dataset.page
                        );

                    }

                );

            }

        );

}



function openPage(
    page
) {

    document
        .querySelectorAll(
            ".nav-btn"
        )
        .forEach(

            item => {

                item.classList.toggle(

                    "active",

                    item.dataset.page ===
                        page

                );

            }

        );


    document
        .querySelectorAll(
            ".page-section"
        )
        .forEach(

            section => {

                section.classList.remove(

                );

            }

        );


    document
        .getElementById(

        )
        ?.classList.add(

        );

    );

function getMaintenanceRequests() {

    return readArray(
        STORAGE.REQUESTS
    );

}



function syncRequestFromOrder(
    order,
    status,
    extra = {}
) {

    if (
        !order?.requestId
    ) {

        return;
    }


    const requests =
        getMaintenanceRequests();


    const request =
        requests.find(
            item =>
                item.requestId ===
                    order.requestId
        );


    if (
        !request
    ) {

        return;
    }


    request.status =
        status;


    request.orderId =
        order.orderId;


    request.workerId =
        order.workerId ||
        getPersonId(
            currentWorker
        ) ||
        request.workerId ||
        "";


    request.workerName =
        order.workerName ||
        currentWorker?.name ||
        request.workerName ||
        "";


    request.bayId =
        order.bayId ||
        request.bayId ||
        "";


    request.bayName =
        order.bayName ||
        request.bayName ||
        "";


    Object.assign(
        request,
        extra,
        {
            updatedAt:
                new Date()
                    .toISOString()
        }
    );


    save(
        STORAGE.REQUESTS,
        requests
    );

}



/* =========================================================
   当前维修员的工单
========================================================= */

function getMyOrders() {

    if (
        !currentWorker
    ) {

        return [];

    }


    const currentName =
        String(
            currentWorker.name ||
            ""
        ).trim();


    const currentId =
        getPersonId(
            currentWorker
        );


    return getOrders()
        .filter(

            item => {

                /*
                 * 新数据优先用 workerId。
                 */

                if (
                    item.workerId &&
                    currentId
                ) {

                    return (
                        String(
                            item.workerId
                        ) ===
                        String(
                            currentId
                        )
                    );

                }


                /*
                 * 兼容旧维修工单 workerName。
                 */

                return (

                    String(
                        item.workerName ||
                        ""
                    )
                        .trim() ===
                    currentName

                );

            }

        );

}

async function handleBeforePhoto(
    input
) {

    const file =
        input.files?.[0];


    if (
        !file
    ) {

        return;

    }


    try {

        pendingBeforePhoto =
            await compressImage(
                file,
                1280,
                .72
            );


        renderPhotoPreviews();

        saveRepairDraft();


    } catch (
        error
    ) {

        console.error(
            error
        );


        alert(
            "维修前照片处理失败。"
        );

    }

}



async function handleAfterPhoto(
    input
) {

    const file =
        input.files?.[0];


    if (
        !file
    ) {

        return;

    }


    try {

function renderPhotoPreviews() {

    const before =
        document.getElementById(
            "beforePhotoPreview"
        );


    if (
        pendingBeforePhoto
    ) {

        before.src =
            pendingBeforePhoto;


        before.style.display =
            "block";


    } else {

        before.removeAttribute(
            "src"
        );


        before.style.display =
            "none";

    }


    const after =
        document.getElementById(
            "afterPhotoPreview"
        );


    if (
        pendingAfterPhoto
    ) {

        after.src =
            pendingAfterPhoto;


        after.style.display =

    } else {

        after.removeAttribute(
            "src"
        );


        after.style.display =
            "none";

    }

}



function compressImage(
    file,
    maxWidth,
    quality
) {

    return new Promise(

        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                function () {

                    const image =
                        new Image();


                    image.onload =
                        function () {

                            let width =
                                image.width;


                            let height =
                                image.height;


                            if (
                                width >
                                maxWidth
                            ) {

                                const ratio =
                                    maxWidth /
                                    width;


                                width =
                                    maxWidth;


                                height =
                                    Math.round(
                                        height *
                                        ratio
                                    );

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(

                                image,
                                0,
                                0,
                                width,
                                height

                            );


                            resolve(

                                canvas.toDataURL(
                                    "image/jpeg",
                                    quality
                                )

                            );

                        };


                    image.onerror =
                        reject;


                    image.src =
                        reader.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }

    );

}

/* =========================================================
   开始维修
========================================================= */

function startRepair() {

    const orderId =
        document.getElementById(
            "activeOrderId"
        ).value;


    const activeOrderBeforeStart =
        getOrders()
            .find(
                item =>
                    item.orderId ===
                        orderId
            );


    if (
        !pendingBeforePhoto

        &&

        !activeOrderBeforeStart?.beforePhotoData
    ) {

        alert(
            "开始维修前必须拍摄维修前照片。"
        );


        return;

    }


    const orders =
        getOrders();


    const order =
        orders.find(

            item =>
                item.orderId ===
                    orderId

        );


    if (
        !order ||
        !isMyOrder(
            order
        )
    ) {

        alert(
            "该维修任务不属于当前维修员。"
        );


        return;

    }


    if (
        order.status !==
            "assigned"

        &&

        order.status !==
            "rework"
    ) {

        alert(
            "该维修任务当前不能执行开始维修操作。"
        );


        return;

    }


    order.beforePhotoData =
        pendingBeforePhoto ||
        order.beforePhotoData ||
        "";


    order.status =
        "working";


    order.startedAt =
        order.startedAt

        ||

        new Date()
            .toISOString();


    order.startedBy =
        currentWorker?.name ||
        "";


    order.startedById =
        getPersonId(
            currentWorker
        );


    saveOrders(
        orders
    );


    syncRequestFromOrder(
        order,
        "working",
        {
            startedAt:
                order.startedAt,

            startedBy:
                order.startedBy,

            startedById:
                order.startedById
        }
    );


    saveRepairDraft();


    renderAll();


    openRepairOrder(
        orderId
    );


    alert(
        "维修已经开始。"
    );

}



/* =========================================================
   等待配件
========================================================= */

function setWaitingParts() {

    const orderId =
        document.getElementById(
            "activeOrderId"
        ).value;


    const note =
        prompt(
            "请输入等待配件说明："
        );


    if (
        note === null
    ) {

        return;

    }


    if (
        !note.trim()
    ) {

        alert(
            "请填写等待配件说明。"
        );


        return;

    }


    saveRepairDraft();


    const orders =
        getOrders();


    const order =
        orders.find(

            item =>
                item.orderId ===
                    orderId

        );


    if (
        !order ||
        !isMyOrder(
            order
        )
    ) {

        return;

    }


    applyDraftToOrder(
        order
    );


    order.status =
        "waiting_parts";


    order.waitingPartsNote =
        note.trim();


    order.waitingPartsAt =
        new Date()
            .toISOString();


    saveOrders(
        orders
    );


    syncRequestFromOrder(
        order,
        "waiting_parts",
        {
            waitingPartsNote:
                order.waitingPartsNote,

            waitingPartsAt:
                order.waitingPartsAt
        }
    );


    closeRepairOperation();


    openPage(
        "waiting"
    );

}



/* =========================================================
   继续维修
========================================================= */

function resumeRepair(
    orderId
) {

    const orders =
        getOrders();


    const order =
        orders.find(

            item =>
                item.orderId ===
                    orderId

        );


    if (
        !order ||
        !isMyOrder(
            order
        )
    ) {

        return;

    }


    if (
        order.status !==
            "waiting_parts"
    ) {

        return;

    }


    order.status =
        "working";


    order.resumedAt =
        new Date()
            .toISOString();


    saveOrders(
        orders
    );


    syncRequestFromOrder(
        order,
        "working",
        {
            resumedAt:
                order.resumedAt
        }
    );


    openPage(
        "working"
    );


    openRepairOrder(
        orderId
    );

}



/* =========================================================
   完成维修
========================================================= */

function finishRepair() {

    const orderId =
        document.getElementById(
            "activeOrderId"
        ).value;


    const faultCause =
        document.getElementById(
            "faultCause"
        )
            .value
            .trim();


    const repairProcess =
        document.getElementById(
            "repairProcess"
        )
            .value
            .trim();


    const actualRepairContent =
        document.getElementById(
            "actualRepairContent"
        )
            .value
            .trim();


    const partsUsed =
        document.getElementById(
            "partsUsed"
        )
            .value
            .trim();


    if (
        !faultCause
    ) {

        alert(
            "请填写实际故障原因。"
        );


        return;

    }


    if (
        !repairProcess
    ) {

        alert(
            "请填写维修过程记录。"
        );


        return;

    }


    if (
        !actualRepairContent
    ) {

        alert(
            "请填写实际维修内容。"
        );


        return;

    }


    if (
        !pendingAfterPhoto
    ) {

        alert(
            "维修完成前必须拍摄维修后照片。"
        );


        return;

    }


    const orders =
        getOrders();


    const order =
        orders.find(

            item =>
                item.orderId ===
                    orderId

        );


    if (
        !order ||
        !isMyOrder(
            order
        )
    ) {

        return;

    }


    if (
        order.status !==
            "working"

        &&

        order.status !==
            "rework"
    ) {

        alert(
            "当前维修任务状态不能提交验收。"
        );


        return;
    }


    order.beforePhotoData =
        pendingBeforePhoto

        ||

        order.beforePhotoData

        ||

        "";


    order.afterPhotoData =
        pendingAfterPhoto;


    order.faultCause =
        faultCause;


    order.repairProcess =
        repairProcess;


    order.actualRepairContent =
        actualRepairContent;


    order.partsUsed =

        partsUsed

            ? partsUsed
                .split(
                    /[,，、\n]+/
                )
                .map(
                    item =>
                        item.trim()
                )
                .filter(
                    Boolean
                )

            : [];


    order.repairResult =
        actualRepairContent;


    const previousStatus =
        order.status;


    order.repairFinishedAt =
        new Date()
            .toISOString();


    if (
        previousStatus ===
            "rework"
    ) {

        order.reworkHistory =
            Array.isArray(
                order.reworkHistory
            )
                ? order.reworkHistory
                : [];


        order.reworkHistory.push({

            completedAt:
                order.repairFinishedAt,

            repairProcess,

            actualRepairContent,

            partsUsed:
                order.partsUsed,

            afterPhotoData:
                order.afterPhotoData
        });
    }


    order.status =
        "waiting_inspection";


    order.finishedBy =
        currentWorker?.name ||
        "";


    order.finishedById =
        getPersonId(
            currentWorker
        );


    saveOrders(
        orders
    );


    syncRequestFromOrder(
        order,
        "waiting_inspection",
        {
            faultCause:
                order.faultCause,

            repairProcess:
                order.repairProcess,

            actualRepairContent:
                order.actualRepairContent,

            partsUsed:
                order.partsUsed,

            repairResult:
                order.repairResult,

            beforePhotoData:
                order.beforePhotoData,

            afterPhotoData:
                order.afterPhotoData,

            repairFinishedAt:
                order.repairFinishedAt,

            finishedBy:
                order.finishedBy,

            finishedById:
                order.finishedById
        }
    );


    clearDraft(
        orderId
    );


    pendingBeforePhoto =
        "";


    pendingAfterPhoto =
        "";


    currentOrder =
        null;


    closeRepairOperation();


    renderAll();


    openPage(
        "history"
    );


    alert(
        "维修完成，已经提交维修管理验收。"
    );

}



/* =========================================================
   当前订单归属
========================================================= */

function isMyOrder(
    order
) {

    if (
        !currentWorker ||
        !order
    ) {

        return false;

    }


    const currentId =
        getPersonId(
            currentWorker
        );


    if (
        order.workerId &&
        currentId
    ) {

        return (
            String(
                order.workerId
            ) ===
            String(
                currentId
            )
        );

    }


    return (

        String(
            order.workerName ||
            ""
        ).trim()

        ===

        String(
            currentWorker.name ||
            ""
        ).trim()

    );

}



/* =========================================================
   草稿写回
========================================================= */

function applyDraftToOrder(
    order
) {

    const draft =
        getDraft(
            order.orderId
        );


    if (
        !draft
    ) {

        return;

    }


    order.faultCause =
        draft.faultCause

        ||

        order.faultCause

        ||

        "";


    order.repairProcess =
        draft.repairProcess

        ||

        order.repairProcess

        ||

        "";


    order.actualRepairContent =
        draft.actualRepairContent

        ||

        order.actualRepairContent

        ||

        "";


    if (
        draft.partsUsed
    ) {

        order.partsUsed =
            draft.partsUsed
                .split(
                    /[,，、\n]+/
                )
                .map(
                    item =>
                        item.trim()
                )
                .filter(
                    Boolean
                );

    }


    if (
        draft.beforePhotoData
    ) {

        order.beforePhotoData =
            draft.beforePhotoData;

    }


    if (
        draft.afterPhotoData
    ) {

        order.afterPhotoData =
            draft.afterPhotoData;

    }

}



/* =========================================================
   清除草稿
========================================================= */

function clearDraft(
    orderId
) {

    const drafts =
        getDrafts();


    delete drafts[
        orderId
    ];


    save(
        STORAGE.DRAFTS,
        drafts
    );

}



/* =========================================================
   关闭维修操作
========================================================= */

function closeRepairOperation() {

    if (
        document.getElementById(
            "activeOrderId"
        ).value
    ) {

        saveRepairDraft();

    }


    document.getElementById(
        "repairOperationArea"
    ).style.display =
        "none";

}

/* =========================================================
   状态文字
========================================================= */

function getStatusText(
    status
) {

    const map = {

        assigned:
            "待接车",

        working:
            "维修中",

        waiting_parts:
            "等待配件",

        rework:
            "返修中",

        waiting_inspection:
            "待验收",

        inspection_passed:
            "验收通过",

        completed:
            "已完成"

    };


    return (

        map[
            status
        ]

        ||

        status

        ||

        "-"

    );

}



/* =========================================================
   数据工具
========================================================= */

function readArray(
    key
) {

    const data =
        readJson(
            key,
            []
        );


    return Array.isArray(
        data
    )

        ? data

        : [];

}



function readJson(
    key,
    fallback
) {

    try {

        const raw =
            localStorage.getItem(
                key
            );


        return raw

            ? JSON.parse(
                raw
            )

            : fallback;


    } catch (
        error
    ) {

        console.error(
            "读取失败：",
            key,
            error
        );


        return fallback;

    }

}



function save(
    key,
    data
) {

    try {

        localStorage.setItem(

            key,

            JSON.stringify(
                data
            )

        );


    } catch (
        error
    ) {

        console.error(
            error
        );


        alert(
            "本地存储空间不足，照片数据可能过多。"
        );

    }

}



function setText(
    id,
    value
) {

    const element =
        document.getElementById(
            id
        );


    if (
        element
    ) {

        element.textContent =
            value;

    }

}



function createId(
    prefix
) {

    return (

        prefix

        +

        "_"

        +

        Date.now()

        +

        "_"

        +

        Math.random()
            .toString(
                36
            )
            .slice(
                2,
                7
            )

    );

}



function formatDateTime(
    value
) {

    if (
        !value
    ) {

        return "-";

    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleString(

        "zh-CN",

        {

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }

    );

}



function formatDuration(
    milliseconds
) {

    if (
        !milliseconds ||
        milliseconds < 0
    ) {

        return "0小时 0分钟";

    }


    const minutes =
        Math.floor(

            milliseconds /
            60000

        );


    const hours =
        Math.floor(

            minutes /
            60

        );


    return (

        hours

        +

        "小时 "

        +

        (
            minutes %
            60
        )

        +

        "分钟"

    );

}



function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value ??
            ""
        );


    return div.innerHTML;

}



function escapeJs(
    value
) {

    return String(
        value ||
        ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}



function goHome() {

    location.href =
        "index.html";

}
