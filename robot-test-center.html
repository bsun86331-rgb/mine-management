<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机器人测试控制中心</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f3f6fb;color:#0f172a}
header{background:#0f172a;color:#fff;padding:16px;position:sticky;top:0;z-index:10}.head{max-width:1300px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{margin:0;font-size:22px}.sub{margin-top:4px;color:#cbd5e1;font-size:12px}.safe{padding:8px 12px;border-radius:999px;background:#052e16;color:#bbf7d0;border:1px solid #166534;font-weight:800;font-size:12px}
main{max-width:1300px;margin:16px auto;padding:0 12px 28px}.notice{padding:12px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;color:#92400e;font-size:13px;line-height:1.6;margin-bottom:12px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:12px}.panel{background:#fff;border:1px solid #dbe3ef;border-radius:14px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.title{padding:13px 15px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}.title h2{font-size:17px;margin:0}.bots{padding:12px;display:grid;gap:9px}
.bot{padding:12px;border:1px solid #dbe3ef;border-radius:11px;background:#fbfdff;cursor:pointer}.bot:hover{border-color:#93c5fd}.bothead{display:flex;justify-content:space-between;gap:10px}.name{font-weight:900}.role{font-size:12px;color:#64748b;margin-top:5px;line-height:1.5}.step{font-size:12px;margin-top:8px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px}
.badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px}.idle{background:#e2e8f0;color:#475569}.running{background:#dbeafe;color:#1d4ed8}.waiting{background:#fef3c7;color:#92400e}.pass{background:#dcfce7;color:#166534}.fail{background:#fee2e2;color:#b91c1c}
.right{min-height:70vh;display:grid;grid-template-rows:auto 1fr auto}.flow{padding:12px 14px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;gap:10px}.flow small{display:block;color:#64748b;margin-top:3px}.chip{padding:7px 10px;background:#eef2ff;color:#4338ca;border-radius:999px;font-size:12px;font-weight:800;height:max-content}
.messages{padding:14px;background:#f8fafc;overflow:auto;max-height:58vh}.msg{display:flex;margin-bottom:10px}.msg.user{justify-content:flex-end}.bubble{max-width:88%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.65;white-space:pre-wrap}.botmsg .bubble{background:#fff;border:1px solid #dbe3ee}.user .bubble{background:#2563eb;color:#fff}.meta{font-size:11px;color:#94a3b8;margin-bottom:4px}
.command{padding:12px;border-top:1px solid #e2e8f0}.commandrow{display:grid;grid-template-columns:220px 1fr auto;gap:8px}select,textarea,button{font:inherit}select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:9px 10px}textarea{min-height:72px;resize:vertical}.send{border:0;border-radius:9px;background:#2563eb;color:white;font-weight:900;padding:0 16px;cursor:pointer}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.quick button{border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
.timeline{margin-top:12px}.tl{padding:12px 16px;max-height:240px;overflow:auto}.tli{display:grid;grid-template-columns:70px 130px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed #e2e8f0;font-size:12px}.tlt{color:#94a3b8}.tlb{font-weight:800}.tld{color:#475569}
@media(max-width:900px){.grid{grid-template-columns:1fr}.commandrow{grid-template-columns:1fr}.send{min-height:44px}.messages{max-height:50vh}}
</style>
</head>
<body>
<header><div class="head"><div><h1>🤖 机器人测试控制中心</h1><div class="sub">Robot Test Control Center · mine-management</div></div><div class="safe">🔒 仅允许 TEST- 数据</div></div></header>
<main>
<div class="notice"><strong>最高安全规则：</strong>所有机器人只能操作 <code>TEST-</code> 开头的数据。任何非 TEST 数据的写入、审批、删除、分配、完成操作都必须立即停止。当前版本先提供控制面板、本地消息/状态模型和执行器接口，后续接入 Playwright 真正执行。</div>

<div class="grid">
<section class="panel">
  <div class="title"><h2>机器人</h2><span>3 个</span></div>
  <div id="bots" class="bots"></div>
</section>

<section class="panel right">
  <div class="flow"><div><strong id="flowTitle">当前流程：待命</strong><small id="flowDesc">等待你下发测试命令</small></div><div id="flowChip" class="chip">IDLE</div></div>
  <div id="messages" class="messages"></div>
  <div class="command">
    <div class="commandrow">
      <select id="target">
        <option value="TestManager">TestManager · 总控</option>
        <option value="DispatchBot">DispatchBot · 调度</option>
        <option value="TruckDriverBot">TruckDriverBot · 汽车司机</option>
      </select>
      <textarea id="input" placeholder="例如：开始测试临时非卸载区卸料完整闭环"></textarea>
      <button id="send" class="send">下发命令</button>
    </div>
    <div class="quick">
      <button data-cmd="开始测试临时非卸载区卸料完整闭环">▶ 临时卸料闭环</button>
      <button data-cmd="检查当前机器人卡在哪一步">📍 当前卡点</button>
      <button data-cmd="暂停当前测试">⏸ 暂停</button>
      <button data-cmd="继续当前测试">▶ 继续</button>
      <button data-cmd="输出当前测试报告">📄 测试报告</button>
      <button data-cmd="全部机器人恢复待命">↺ 全部待命</button>
    </div>
  </div>
</section>
</div>

<section class="panel timeline"><div class="title"><h2>执行时间线</h2><span>最近事件</span></div><div id="timeline" class="tl"></div></section>
</main>

<script>
"use strict";
const KEY="__robotTestCenterStateV1";
const defaults={
  TestManager:{name:"TestManager",icon:"🧠",role:"测试总控：分配步骤、判断 PASS / FAIL、汇总报告",status:"idle",step:"等待测试命令"},
  DispatchBot:{name:"DispatchBot",icon:"📋",role:"调度机器人：审核 TEST 任务、GPS异常、临时卸料",status:"idle",step:"待命"},
  TruckDriverBot:{name:"TruckDriverBot",icon:"🚚",role:"汽车司机机器人：执行 TEST 司机端运输流程",status:"idle",step:"待命"}
};
let state=load();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&v.bots)return v}catch(e){}return{bots:JSON.parse(JSON.stringify(defaults)),messages:[],timeline:[],flow:{title:"当前流程：待命",desc:"等待你下发测试命令",chip:"IDLE"}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function time(){return new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function sl(s){return({idle:"待命",running:"执行中",waiting:"等待用户",pass:"通过",fail:"失败"})[s]||s}
function renderBots(){bots.innerHTML=Object.values(state.bots).map(b=>`<div class="bot" data-name="${esc(b.name)}"><div class="bothead"><div class="name">${b.icon} ${esc(b.name)}</div><span class="badge ${b.status}">${sl(b.status)}</span></div><div class="role">${esc(b.role)}</div><div class="step"><strong>当前：</strong>${esc(b.step)}</div></div>`).join("");bots.querySelectorAll(".bot").forEach(x=>x.onclick=()=>target.value=x.dataset.name)}
function renderMsgs(){messages.innerHTML=state.messages.length?state.messages.map(m=>`<div class="msg ${m.type==="user"?"user":"botmsg"}"><div class="bubble"><div class="meta">${esc(m.sender)} · ${esc(m.time)}</div>${esc(m.text)}</div></div>`).join(""):`<div class="msg botmsg"><div class="bubble"><div class="meta">TestManager · ${time()}</div>系统已就绪。你可以通过下方对话框下发命令。当前安全锁：只允许 TEST- 数据。</div></div>`;messages.scrollTop=messages.scrollHeight}
function renderTl(){timeline.innerHTML=state.timeline.length?state.timeline.slice().reverse().map(x=>`<div class="tli"><div class="tlt">${esc(x.time)}</div><div class="tlb">${esc(x.bot)}</div><div class="tld">${esc(x.text)}</div></div>`).join(""):`<div style="color:#94a3b8;font-size:12px">暂无执行记录</div>`}
function renderFlow(){flowTitle.textContent=state.flow.title;flowDesc.textContent=state.flow.desc;flowChip.textContent=state.flow.chip}
function render(){renderBots();renderMsgs();renderTl();renderFlow();save()}
function msg(sender,text,type="bot"){state.messages.push({sender,text,type,time:time()});renderMsgs();save()}
function tl(bot,text){state.timeline.push({bot,text,time:time()});state.timeline=state.timeline.slice(-100);renderTl();save()}
function setBot(n,status,step){if(!state.bots[n])return;state.bots[n].status=status;state.bots[n].step=step;renderBots();save()}
function setFlow(title,desc,chip){state.flow={title,desc,chip};renderFlow();save()}
function safety(command){
  const ids=(command.match(/\b(?:TASK|TRIP|DRIVER|VEHICLE|SHIFT|ZONE|REQ|REQUEST)-[A-Z0-9_-]+\b/gi)||[]);
  const bad=ids.filter(x=>!x.toUpperCase().startsWith("TEST-"));
  if(bad.length)throw new Error("安全拦截：命令包含非 TEST 数据："+bad.join(", "));
}
function executorEvent(e){
  const b=e.bot||"TestManager";
  if(e.status)setBot(b,e.status,e.step||e.message||"");
  if(e.message){msg(b,e.message);tl(b,e.message)}
  if(e.flow)setFlow(e.flow.title||state.flow.title,e.flow.desc||state.flow.desc,e.flow.chip||state.flow.chip);
}
function command(targetName,commandText){
  safety(commandText);
  msg("你 → "+targetName,commandText,"user");tl("USER",targetName+" ← "+commandText);
  if(window.robotExecutor&&typeof window.robotExecutor.execute==="function"){
    return window.robotExecutor.execute({target:targetName,command:commandText,onEvent:executorEvent});
  }
  simulate(targetName,commandText);
}
function simulate(t,c){
  if(/全部机器人恢复待命/.test(c)){Object.keys(state.bots).forEach(n=>setBot(n,"idle","待命"));setFlow("当前流程：待命","等待你下发测试命令","IDLE");msg("TestManager","全部机器人已恢复待命。");tl("TestManager","全部机器人恢复待命");return}
  if(/临时非卸载区卸料|临时卸料闭环/.test(c)){tempFlow();return}
  if(/卡在哪|当前卡点/.test(c)){const a=Object.values(state.bots).find(b=>["running","waiting","fail"].includes(b.status));msg(a?a.name:"TestManager",a?"当前卡点："+a.step:"当前没有卡住的机器人。");return}
  if(/暂停/.test(c)){const a=Object.values(state.bots).find(b=>b.status==="running");if(a){setBot(a.name,"waiting","测试已暂停，等待用户继续");setFlow("当前流程：已暂停",a.name+" 等待继续","PAUSED");msg(a.name,"已暂停，等待你的继续命令。")}else msg("TestManager","当前没有正在执行的机器人。");return}
  if(/继续当前测试|继续测试/.test(c)){const a=Object.values(state.bots).find(b=>b.status==="waiting");if(a){setBot(a.name,"running","恢复执行中");setFlow("当前流程：恢复执行",a.name+" 正在继续","RUNNING");msg(a.name,"收到，继续执行。")}else msg("TestManager","当前没有等待继续的机器人。");return}
  if(/测试报告/.test(c)){msg("TestManager","当前测试报告：\n"+Object.values(state.bots).map(b=>`${b.name}: ${sl(b.status)} / ${b.step}`).join("\n"));tl("TestManager","输出当前测试报告");return}
  setBot(t,"running","正在解析命令");setFlow("当前流程："+t+" 执行命令",c,"RUNNING");
  setTimeout(()=>{setBot(t,"waiting","当前控制面板尚未接入真实 Playwright 执行器");msg(t,"命令已收到。当前停在真实 Playwright 执行器接入点。");tl(t,"等待接入真实执行器");setFlow("当前流程：等待接入执行器",t+" 已反馈","WAITING")},400);
}
function tempFlow(){
  setFlow("当前流程：临时非卸载区卸料闭环","TruckDriverBot → DispatchBot → TestManager","RUNNING");
  setBot("TestManager","running","正在编排临时卸料测试");msg("TestManager","开始编排：临时非卸载区卸料完整闭环。");tl("TestManager","开始临时卸料闭环");
  setTimeout(()=>{setBot("TestManager","idle","等待角色机器人执行");setBot("TruckDriverBot","running","检查 TEST 司机、TEST 任务、TEST 车辆");msg("TruckDriverBot","正在执行安全检查：司机、任务、车辆必须全部为 TEST- 数据。");tl("TruckDriverBot","安全检查 TEST 数据")},450);
  setTimeout(()=>{setBot("TruckDriverBot","waiting","需要真实 Playwright 执行器进入司机端并提交临时卸料");msg("TruckDriverBot","当前流程卡在我这里：控制面板编排已完成，但还没有连接真实 Playwright 执行器。下一步需要把 TruckDriverBot 的真实执行方法接到这个面板。");tl("TruckDriverBot","卡点：等待真实 Playwright 执行器");setFlow("当前卡点：TruckDriverBot","等待接入真实 Playwright 执行器","WAITING")},1000);
}
send.onclick=()=>{const c=input.value.trim();if(!c)return alert("请输入测试命令");try{command(target.value,c);input.value=""}catch(e){msg("TestSafetyGuard",e.message);tl("TestSafetyGuard",e.message);setFlow("当前流程：安全拦截","发现非 TEST 数据","BLOCKED")}}
input.onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))send.click()}
document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{target.value="TestManager";input.value=b.dataset.cmd;send.click()});
render();
</script>
</body></html>
