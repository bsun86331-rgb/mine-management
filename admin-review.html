<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>人员信息管理</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <header>

        <h1>人员信息管理</h1>

        <p>Personnel Management</p>

    </header>


    <main>

        <section>

            <h2>人员信息汇总表</h2>


            <div id="emptyMessage">

                <p>
                    当前没有人员登记信息。
                </p>

            </div>


            <div
                id="personnelTableArea"
                style="
                    display:none;
                    overflow-x:auto;
                "
            >

                <table>

                    <thead>

                        <tr>

                            <th>姓名</th>

                            <th>手机号</th>

                            <th>紧急联系人</th>

                            <th>紧急联系电话</th>

                            <th>岗位</th>

                            <th>车队</th>

                            <th>入职日期</th>

                            <th>审核状态</th>

                            <th>操作</th>

                        </tr>

                    </thead>


                    <tbody
                        id="personnelTableBody"
                    >
                    </tbody>

                </table>

            </div>


            <button
                type="button"
                onclick="location.href='index.html'"
            >
                返回登录端口
            </button>

        </section>


        <section
            id="detailSection"
            style="
                display:none;
                margin-top:20px;
            "
        >

            <h2>
                人员详细档案
            </h2>


            <p>
                <strong>姓名：</strong>
                <span id="detailName"></span>
            </p>


            <p>
                <strong>手机号：</strong>
                <span id="detailPhone"></span>
            </p>


            <p>
                <strong>紧急联系人：</strong>
                <span id="detailEmergencyContact"></span>
            </p>


            <p>
                <strong>紧急联系人电话：</strong>
                <span id="detailEmergencyPhone"></span>
            </p>


            <p>
                <strong>身份证号：</strong>
                <span id="detailIdCardNumber"></span>
            </p>


            <p>
                <strong>护照号：</strong>
                <span id="detailPassportNumber"></span>
            </p>


            <p>
                <strong>银行卡号：</strong>
                <span id="detailBankCardNumber"></span>
            </p>


            <p>
                <strong>岗位：</strong>
                <span id="detailPosition"></span>
            </p>


            <p>
                <strong>所属车队：</strong>
                <span id="detailTeam"></span>
            </p>


            <p>
                <strong>入职日期：</strong>
                <span id="detailEntryDate"></span>
            </p>


            <p>
                <strong>备注：</strong>
                <span id="detailRemark"></span>
            </p>


            <p>
                <strong>审核状态：</strong>
                <span id="detailStatus"></span>
            </p>


            <h2
                style="margin-top:30px;"
            >
                证件照片
            </h2>


            <div id="photoArea">

                <div>

                    <h3>身份证照片</h3>

                    <img
                        id="detailIdCardPhoto"
                        alt="身份证照片"
                        style="display:none;"
                    >

                    <p id="idCardNoPhoto">
                        未上传
                    </p>

                </div>


                <div>

                    <h3>护照照片</h3>

                    <img
                        id="detailPassportPhoto"
                        alt="护照照片"
                        style="display:none;"
                    >

                    <p id="passportNoPhoto">
                        未上传
                    </p>

                </div>


                <div>

                    <h3>驾驶证照片</h3>

                    <img
                        id="detailDriverLicensePhoto"
                        alt="驾驶证照片"
                        style="display:none;"
                    >

                    <p id="driverLicenseNoPhoto">
                        未上传
                    </p>

                </div>


                <div>

                    <h3>银行卡照片</h3>

                    <img
                        id="detailBankCardPhoto"
                        alt="银行卡照片"
                        style="display:none;"
                    >

                    <p id="bankCardNoPhoto">
                        未上传
                    </p>

                </div>

            </div>


            <button
                id="approveButton"
                type="button"
            >
                审核通过
            </button>


            <button
                id="rejectButton"
                type="button"
            >
                审核不通过
            </button>


            <button
                id="printProfileButton"
                type="button"
            >
                打印人员档案
            </button>


            <button
                id="printPhotosButton"
                type="button"
            >
                打印证件照片
            </button>


            <button
                id="closeDetailButton"
                type="button"
            >
                关闭人员详情
            </button>

        </section>

    </main>


    <footer>

        <p>
            矿山管理系统 · 管理员端 V2.1
        </p>

    </footer>


    <script
        src="js/admin-review.js"
    ></script>


</body>

</html>
