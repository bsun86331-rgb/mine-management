    <!-- =====================================================
         管理员登录保护

         V2.10.0G 本地测试版：
         1. 必须存在 managementSession
         2. 必须是管理员
         3. 必须在30分钟有效期内
         4. 必须能在 personnelRecords 找到本人
         5. 本人仍然必须处于审核通过状态
    ====================================================== -->

    <script>

        (function () {

            "use strict";


            function getPersonId(person) {

                return (
                    person?.personId ||
                    person?.driverId ||
                    person?.employeeId ||
                    person?.id ||
                    ""
                );

            }


            function normalizePosition(position) {

                const map = {

                    "管理员":
                        "管理员"

                };


                return (
                    map[position] ||
                    position ||
                    ""
                );

            }


            function getPersonnelRecords() {

                try {

                    const data =
                        JSON.parse(
                            localStorage.getItem(
                                "personnelRecords"
                            )
                        );


                    return Array.isArray(data)
                        ? data
                        : [];


                } catch (error) {

                    return [];

                }

            }


            function isApproved(person) {

                if (!person) {

                    return false;

                }


                if (
                    person.status === "rejected" ||
                    person.approvalStatus === "rejected" ||
                    person.status === "disabled" ||
                    person.status === "resigned" ||
                    person.personnelStatus === "停用" ||
                    person.personnelStatus === "离职"
                ) {

                    return false;

                }


                return (

                    person.approvalStatus ===
                        "approved" ||

                    person.status ===
                        "approved" ||

                    person.status ===
                        "active" ||

                    person.status ===
                        "working" ||

                    person.status ===
                        "leave" ||

                    person.personnelStatus ===
                        "在职可用" ||

                    person.personnelStatus ===
                        "作业中" ||

                    person.personnelStatus ===
                        "请假"

                );

            }


            function redirectLogin() {

                sessionStorage.removeItem(
                    "managementSession"
                );


                localStorage.setItem(
                    "pendingProtectedPosition",
                    "管理员"
                );


                location.replace(
                    "management-login.html?position=" +
                    encodeURIComponent(
                        "管理员"
                    )
                );

            }


            let session = null;


            try {

                session =
                    JSON.parse(
                        sessionStorage.getItem(
                            "managementSession"
                        )
                    );

            } catch (error) {

                session = null;

            }


            if (
                !session ||
                session.verified !== true ||
                normalizePosition(
                    session.position
                ) !== "管理员" ||
                !session.personId ||
                Number(
                    session.expiresAt
                ) <= Date.now()
            ) {

                redirectLogin();

                return;

            }


            const records =
                getPersonnelRecords();


            const administrator =
                records.find(
                    person =>

                        getPersonId(person) ===
                            session.personId &&

                        normalizePosition(
                            person.position
                        ) ===
                            "管理员"
                );


            if (
                !administrator ||
                !isApproved(
                    administrator
                )
            ) {

                redirectLogin();

                return;

            }


            localStorage.setItem(
                "currentPersonId",
                session.personId
            );


            window.__ADMIN_SESSION__ =
                session;


            window.__ADMIN_PERSON__ =
                administrator;

        })();

    </script>
