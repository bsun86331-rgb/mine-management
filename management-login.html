<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#0f172a">

    <title>管理权限验证 - 矿山管理系统</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        header {
            background: #0f172a;
            color: #ffffff;
            padding: 22px 16px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 7px 0 0;
            font-size: 13px;
            opacity: .8;
        }

        main {
            max-width: 460px;
            margin: 0 auto;
            padding: 35px 14px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px 20px;
            box-shadow:
                0 8px 30px
                rgba(15, 23, 42, .08);
        }

        .lock-icon {
            text-align: center;
            font-size: 54px;
            margin-bottom: 10px;
        }

        .title {
            margin: 0;
            text-align: center;
            font-size: 22px;
        }

        .description {
            margin: 10px 0 22px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .person-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 7px 0;
            font-size: 14px;
        }

        .label {
            color: #64748b;
        }

        .value {
            font-weight: 700;
            text-align: right;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 18px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, .1);
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .primary-btn {
            background: #2563eb;
            color: #ffffff;
        }

        .secondary-btn {
            background: #ffffff;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .message {
            display: none;
            padding: 11px;
            border-radius: 9px;
            margin-bottom: 15px;
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            display: block;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .notice {
            margin-top: 18px;
            padding: 12px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            color: #9a3412;
            font-size: 12px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            font-size: 12px;
        }

    </style>
</head>


<body>

<header>

    <h1>
        🔐 管理权限验证
    </h1>

    <p>
        Management Security Verification
    </p>

</header>


<main>

    <div class="card">

        <div class="lock-icon">
            🔐
        </div>


        <h2
            class="title"
            id="pageTitle"
        >
            密码验证
        </h2>


        <p class="description">
            当前岗位属于高权限岗位。
            必须先通过管理员入职审核，
            再完成密码验证才能进入系统。
        </p>


        <div class="person-box">

            <div class="row">

                <span class="label">
                    姓名
                </span>

                <span
                    class="value"
                    id="personName"
                >
                    -
                </span>

            </div>


            <div class="row">

                <span class="label">
                    岗位
                </span>

                <span
                    class="value"
                    id="personPosition"
                >
                    -
                </span>

            </div>


            <div class="row">

                <span class="label">
                    审核状态
                </span>

                <span
                    class="value"
                    id="approvalStatus"
                >
                    -
                </span>

            </div>

        </div>


        <div
            class="message"
            id="messageBox"
        >
        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="password">
                    管理密码
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="请输入管理密码"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-btn"
                id="loginButton"
            >
                验证并进入
            </button>


            <button
                type="button"
                class="secondary-btn"
                onclick="goHome()"
            >
                返回系统首页
            </button>

        </form>


        <div class="notice">

            当前为 V2.9 本地测试版。

            本页面只用于建立总经理 / 管理员二次验证流程。

            正式接入 Supabase 后，
            管理密码和权限验证必须迁移到服务器端，
            并删除网页中的测试密码。

        </div>

    </div>

</main>


<footer>
    矿山管理系统 · 管理权限验证 V2.9.6
</footer>


<script>

"use strict";


/* =========================================================
   岗位兼容
========================================================= */

function normalizePosition(position) {

    const map = {

        "总经理":
            "总经理",

        "管理员":
            "管理员"

    };


    return (
        map[position] ||
        position ||
        ""
    );

}


/* =========================================================
   允许二次验证的岗位
========================================================= */

const PROTECTED_POSITIONS = [
    "总经理",
    "管理员"
];


/* =========================================================
   对应页面
========================================================= */

const PROTECTED_PAGES = {

    "总经理":
        "general-manager.html",

    "管理员":
        "admin-review.html"

};


/* =========================================================
   当前岗位
========================================================= */

const params =
    new URLSearchParams(
        location.search
    );


const position =
    normalizePosition(

        params.get("position") ||

        localStorage.getItem(
            "pendingProtectedPosition"
        ) ||

        ""

    );


/* =========================================================
   岗位安全检查
========================================================= */

if (
    !PROTECTED_POSITIONS.includes(
        position
    )
) {

    alert(
        "当前岗位不需要管理密码验证。"
    );


    location.replace(
        "index.html"
    );

}


/* =========================================================
   人员资料
========================================================= */

function getPersonnelRecords() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    "personnelRecords"
                )
            );


        return Array.isArray(data)
            ? data
            : [];


    } catch (error) {

        console.error(
            "人员资料读取失败：",
            error
        );


        return [];

    }

}


/* =========================================================
   人员ID
========================================================= */

function getPersonId(person) {

    return (

        person?.personId ||

        person?.driverId ||

        person?.id ||

        ""

    );

}


/* =========================================================
   判断岗位
========================================================= */

function personMatchesPosition(
    person,
    targetPosition
) {

    return (

        normalizePosition(
            person?.position
        ) ===
        normalizePosition(
            targetPosition
        )

    );

}


/* =========================================================
   获取当前待验证人员

   优先顺序：

   1. pendingProtectedPersonId
   2. currentPersonId
   3. 测试阶段：该岗位只有一个人时自动识别

   这样即使以后存在多个管理员，
   也优先精确识别当前人员。
========================================================= */

function getCurrentPerson() {

    const records =
        getPersonnelRecords();


    /* -------------------------
       第一优先级
       待验证人员ID
    -------------------------- */

    const pendingId =
        localStorage.getItem(
            "pendingProtectedPersonId"
        );


    if (pendingId) {

        const person =
            records.find(
                item =>

                    getPersonId(item) ===
                        pendingId &&

                    personMatchesPosition(
                        item,
                        position
                    )
            );


        if (person) {

            return person;

        }

    }


    /* -------------------------
       第二优先级
       当前登录人员ID
    -------------------------- */

    const currentPersonId =
        localStorage.getItem(
            "currentPersonId"
        );


    if (currentPersonId) {

        const person =
            records.find(
                item =>

                    getPersonId(item) ===
                        currentPersonId &&

                    personMatchesPosition(
                        item,
                        position
                    )
            );


        if (person) {

            return person;

        }

    }


    /* -------------------------
       第三优先级

       仅 V2.9 本地测试兼容。

       如果这个岗位只有一个人员，
       可以自动识别。

       Supabase 正式版删除。
    -------------------------- */

    const samePosition =
        records.filter(
            item =>
                personMatchesPosition(
                    item,
                    position
                )
        );


    if (
        samePosition.length === 1
    ) {

        return samePosition[0];

    }


    return null;

}


/* =========================================================
   审核状态
========================================================= */

function isApproved(person) {

    if (!person) {

        return false;

    }


    /*
       驳回 / 停用 / 离职优先阻止。
    */

    if (
        person.status === "rejected" ||
        person.approvalStatus === "rejected" ||
        person.status === "disabled" ||
        person.status === "resigned" ||
        person.personnelStatus === "停用" ||
        person.personnelStatus === "离职"
    ) {

        return false;

    }


    return (

        person.approvalStatus ===
            "approved" ||

        person.status ===
            "approved" ||

        person.status ===
            "active" ||

        person.status ===
            "working" ||

        person.status ===
            "leave" ||

        person.personnelStatus ===
            "在职可用" ||

        person.personnelStatus ===
            "作业中" ||

        person.personnelStatus ===
            "请假"

    );

}


/* =========================================================
   当前人员
========================================================= */

let currentPerson =
    getCurrentPerson();


/* =========================================================
   必须找到当前人员
========================================================= */

if (!currentPerson) {

    alert(
        "无法确定当前登录人员。请从系统首页重新进入自己的岗位。"
    );


    clearPendingState();


    location.replace(
        "index.html"
    );

}


/* =========================================================
   岗位必须一致
========================================================= */

if (
    currentPerson &&
    !personMatchesPosition(
        currentPerson,
        position
    )
) {

    alert(
        "当前人员岗位与验证岗位不一致。"
    );


    clearPendingState();


    location.replace(
        "index.html"
    );

}


/* =========================================================
   必须先通过管理员审核
========================================================= */

if (
    currentPerson &&
    !isApproved(
        currentPerson
    )
) {

    alert(
        "您的入职资料尚未通过管理员审核。"
    );


    const personId =
        getPersonId(
            currentPerson
        );


    if (personId) {

        localStorage.setItem(
            "currentPersonId",
            personId
        );

    }


    location.replace(

        "person-waiting.html?position=" +

        encodeURIComponent(
            position
        )

    );

}


/* =========================================================
   固定当前人员ID

   到这里说明已经：
   1. 找到人员
   2. 岗位一致
   3. 审核通过
========================================================= */

if (currentPerson) {

    const personId =
        getPersonId(
            currentPerson
        );


    if (personId) {

        localStorage.setItem(
            "currentPersonId",
            personId
        );


        localStorage.setItem(
            "pendingProtectedPersonId",
            personId
        );

    }


    localStorage.setItem(
        "pendingProtectedPosition",
        position
    );

}


/* =========================================================
   页面显示
========================================================= */

if (currentPerson) {

    document.getElementById(
        "personName"
    ).textContent =
        currentPerson.name ||
        "-";


    document.getElementById(
        "personPosition"
    ).textContent =
        position;


    document.getElementById(
        "approvalStatus"
    ).textContent =
        "已通过";


    document.getElementById(
        "pageTitle"
    ).textContent =
        position +
        "密码验证";

}


/* =========================================================
   V2.9 临时测试密码

   仅用于当前前端流程测试。

   正式上线必须删除。
========================================================= */

const TEMP_PASSWORDS = {

    "总经理":
        "888888",

    "管理员":
        "666666"

};


/* =========================================================
   登录验证
========================================================= */

document.getElementById(
    "loginForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const passwordInput =
            document.getElementById(
                "password"
            );


        const password =
            passwordInput.value;


        if (!password) {

            showError(
                "请输入管理密码。"
            );


            return;

        }


        const correctPassword =
            TEMP_PASSWORDS[position];


        if (
            password !==
            correctPassword
        ) {

            showError(
                "密码错误，请重新输入。"
            );


            passwordInput.value =
                "";


            passwordInput.focus();


            return;

        }


        /*
           密码正确后不能直接放行。

           必须重新读取人员库，
           防止验证过程中管理员权限被撤销。
        */

        const latestPerson =
            getCurrentPerson();


        if (!latestPerson) {

            alert(
                "当前人员资料不存在，请重新登录。"
            );


            clearPendingState();


            location.replace(
                "index.html"
            );


            return;

        }


        if (
            !personMatchesPosition(
                latestPerson,
                position
            )
        ) {

            alert(
                "当前人员岗位已经发生变化，不能进入此管理页面。"
            );


            clearPendingState();


            location.replace(
                "index.html"
            );


            return;

        }


        if (
            !isApproved(
                latestPerson
            )
        ) {

            sessionStorage.removeItem(
                "managementSession"
            );


            alert(
                "当前人员权限已经发生变化，请重新审核。"
            );


            location.replace(

                "person-waiting.html?position=" +

                encodeURIComponent(
                    position
                )

            );


            return;

        }


        const personId =
            getPersonId(
                latestPerson
            );


        if (!personId) {

            showError(
                "当前人员缺少人员ID，无法建立登录会话。"
            );


            return;

        }


        /*
           建立30分钟管理会话。

           不保存用户输入的密码。
        */

        const now =
            Date.now();


        const session = {

            personId:
                personId,

            name:
                latestPerson.name ||
                "",

            position:
                position,

            verified:
                true,

            verifiedAt:
                now,

            expiresAt:
                now +
                (
                    30 *
                    60 *
                    1000
                )

        };


        sessionStorage.setItem(
            "managementSession",
            JSON.stringify(
                session
            )
        );


        localStorage.setItem(
            "currentPersonId",
            personId
        );


        /*
           验证已经完成，
           清除待验证状态。
        */

        clearPendingState();


        const targetPage =
            PROTECTED_PAGES[position];


        if (!targetPage) {

            sessionStorage.removeItem(
                "managementSession"
            );


            alert(
                "未找到对应管理页面。"
            );


            return;

        }


        location.replace(
            targetPage
        );

    }
);


/* =========================================================
   清除待验证状态
========================================================= */

function clearPendingState() {

    localStorage.removeItem(
        "pendingProtectedPersonId"
    );


    localStorage.removeItem(
        "pendingProtectedPosition"
    );

}


/* =========================================================
   错误提示
========================================================= */

function showError(message) {

    const box =
        document.getElementById(
            "messageBox"
        );


    box.textContent =
        message;


    box.className =
        "message error";

}


/* =========================================================
   返回首页
========================================================= */

function goHome() {

    clearPendingState();


    sessionStorage.removeItem(
        "managementSession"
    );


    location.href =
        "index.html";

}

</script>


</body>
</html>
